radiografias interproximais para a avaliação radiográfica de cárie nos pré-molares superiores e inferiores, dos lados direito e esquerdo."], "gab": null, "fig": true}, {"ano": 2007, "n": 20, "enun": "Os critérios para uma oclusão funcional ideal são importan- tes quando se objetiva tratar as patologias oclusais. Dentre as características abaixo, qual representa uma condição oclusal ideal?", "alts": ["Em movimento protusivo, deve haver contato entre dentes anteriores e posteriores.", "Ocorre a presença de contatos heterogêneos de todos os dentes anteriores quando a boca se fecha.", "A guia de desoclusão mais desejável é fornecida pelos pré-molares e deve haver contato somente do lado de balanceio.", "As forças verticais criadas pelos contatos dentais são bem aceitas pelo ligamento periodontal, porém as forças horizontais não podem ser efetivamente dissipadas.", "Os dentes anteriores devem contatar ligeiramente com mais força do que os dentes posteriores em relação cêntrica."], "gab": "D", "fig": true}, {"ano": 2007, "n": 21, "enun": "Ao exame clínico, paciente apresenta extensa lesão cariosa e presença de bolsa de 12 milímetros apenas no sítio mesiovestibular do elemento 11. Os elementos adjacentes apresentam periodonto normal, e o elemento 11 respondeu negativamente ao teste de vitalidade pulpar. Quais são o diagnóstico e o plano de tratamento indicado, respectivamente?", "alts": ["Lesão periodontal primária e tratamento periodontal, somente.", "Lesão periodontal primária com envolvimento endodôntico secundário, tratamento endodôntico e periodontal.", "Lesão endopério verdadeira, tratamento endodôntico e periodontal.", "Lesão endodôntica primária com envolvimento periodontal secundário, tratamento endodôntico e periodontal.", "Lesão endodôntica primária e tratamento endodôntico, somente."], "gab": "D", "fig": false}, {"ano": 2007, "n": 22, "enun": "As resinas compostas são capazes de restaurar forma, função e estética de dentes anteriores. Considerando as características e indicações das resinas compostas, qual a alternativa para restaurar uma classe IV em um incisivo central superior que sofreu fratura parcial da coroa?", "alts": ["Microparticulada nas porções vestibular e palatina.", "Microparticulada na porção vestibular e micro-híbrida na porção palatina.", "Microparticulada na porção palatina e micro-híbrida na porção vestibular.", "Macroparticulada nas porções vestibular e palatina.", "Macroparticulada na porção palatina e microparticulada na porção vestibular."], "gab": "B", "fig": false}, {"ano": 2007, "n": 23, "enun": "Paciente do sexo feminino, 20 anos, chega a consultório odontológico da Rede Pública de Saúde requerendo restaura- ção do elemento 22 que apresenta cavidade do tipo Classe III de profundidade média, com terminação cervical em dentina e comprometimento estético. O cirurgião-dentista dispõe de adesivo dentinário de IV geração, resinas compostas micro- híbridas, cimento de ionômero de vidro convencional e ácidos fosfórico e poliacrílico. Quais os passos da técnica restaura- dora recomendada?", "alts": ["Condicionamento com ácido poliacrílico, utilização de ionômero de vidro, condicionamento com ácido fosfórico, uso de adesivo e resina composta.", "Condicionamento com ácido poliacrílico e utilização de ionômero de vidro, adesivo e resina composta.", "Condicionamento com ácido poliacrílico, uso de adesivo e de ionômero de vidro.", "Condicionamento com ácido fosfórico, uso de ionômero de vidro e de adesivo, condicionamento com ácido poliacrílico e utilização de resina composta.", "Condicionamento com ácido fosfórico e utilização de adesivo e de ionômero de vidro."], "gab": "A", "fig": false}, {"ano": 2007, "n": 24, "enun": "Um paciente com periodontite crônica moderada generaliza- da concluiu a terapia periodontal básica. Na consulta de reavaliação, foi verificado um padrão adequado de higiene bucal, sem inflamação gengival, ausência de sangramento à sondagem, profundidades de sondagem acentuadamente re- duzidas e melhora dos níveis de inserção clínica. Com base nesses achados clínicos, considere as afirmações a seguir.\nI – A consulta para reavaliação deve ser realizada sete dias após o término da terapia básica, período necessário para a cicatrização do periodonto.\nII – O tratamento ortodôntico, visando a uma reposição dentária estética e funcional, pode ser iniciado mesmo naqueles elementos dentários que apresentam um periodonto reduzido.\nIII – Há indicação de cirurgia periodontal, visando a obter acesso às superfícies radiculares, mesmo quando as profundidades à sondagem nos sítios remanescentes forem ≤ 3 mm.\nIV – Em virtude de uma prevalência de doença prévia, a tera- pia periodontal de suporte deve ser instituída, com a fina- lidade de prevenção da recidiva da doença.\nEstão corretas, apenas, as afirmações", "alts": ["I e II.", "I e III.", "I e IV.", "II e III.", "II e IV."], "gab": "E", "fig": false}, {"ano": 2007, "n": 25, "enun": "Paciente do sexo masculino, transplantado, em uso de medicação imunossupressora e com boa saúde oral, apre- senta fratura do elemento 15 com comprometimento radicular severo, contra-indicando sua manutenção. Ao exame clínico e radiográfico foram feitas as seguintes observações: restauração MOD extensa no elemento 14, tratamento endodôntico satisfatório, núcleo metálico fundido e co- roa total no elemento 16. Qual o tratamento recomendado?", "alts": ["Prótese fixa adesiva utilizando a coroa do dente natural.", "Prótese fixa com pôntico com superfície cervical lisa, polida e convexa.", "Prótese fixa com pôntico que restaure a estética, mesmo que dificulte a limpeza.", "Prótese fixa com pôntico pressionando fortemente o tecido fibromucoso.", "Implante dentário endósseo associado à coroa metalocerâmica."], "gab": "B", "fig": true}, {"ano": 2007, "n": 26, "enun": "Nas restaurações metálicas fundidas em liga de prata, qual das terminações apresentadas abaixo permite uma espessu- ra adequada para prover rigidez estrutural ao metal e facilitar a adaptação da peça fundida e o escoamento do agente cimentante?", "alts": ["Ombro reto.", "Ombro de 135 o .", "Ombro biselado.", "Borda em lâmina.", "Chanfro."], "gab": "E", "fig": true}, {"ano": 2007, "n": 27, "enun": "Os bifosfonatos são fármacos sintéticos utilizados no trata- mento de neoplasia maligna óssea, Doença de Paget, osteoporose pós-menopausa e osteopenia. A forma mais comumente utilizada para osteoporose/osteopenia é o alendronato de sódio via oral. Recentemente, a classe odontológica foi alertada sobre a possibilidade de que pacientes que fazem uso de bifosfonatos e são submetidos à cirurgia dentoalveolar apresentem risco de adquirir uma complicação, com manifestação bucal.\nSobre este assunto afirma-se que\nI – se trata da complicação denominada Osteonecrose dos\nMaxilares;\nII – se trata da complicação denominada Anquilose Dentária\nGeneralizada;\nIII – igualmente aos medicamentos à base de Ácido Acetil- salicílico, os bifosfonatos devem ser suspensos por, pelo menos, sete dias antes da realização da cirurgia, por interferir na coagulação;\nIV – cabe ao cirurgião-dentista a realização de anamnese criteriosa e investigativa quanto ao uso de bifosfonatos por seus pacientes.\nEstão corretas, apenas, as afirmativas", "alts": ["I e III.", "I e IV.", "II e III.", "II e IV.", "II, III e IV."], "gab": "B", "fig": false}, {"ano": 2007, "n": 28, "enun": "Paciente do sexo feminino, 9 anos de idade, portadora de boa condição de higiene oral e sem sangramento gengival à sondagem, apresenta uma lesão de 1,0 cm no tecido gengival do arco inferior esquerdo, correspondendo a uma massa exofítica indolor, bem delimitada, firme à palpação, não invasiva, com base séssil e superfície lisa. Essa lesão possui a mesma cor da mucosa circunjacente. Após biópsia, o exame histopatológico revelou a presença de tecido fibroso com feixes densos de fibras colágenas associadas a células fusiformes, coberto por um epitélio pavimentoso estratificado.\nCom base nos dados apresentados, qual o diagnóstico da lesão?", "alts": ["Fibroma.", "Papiloma escamoso.", "Mucocele.", "Granuloma piogênico.", "Linfangioma."], "gab": "A", "fig": false}, {"ano": 2007, "n": 29, "enun": "Criança do sexo feminino, 6 anos de idade, apresenta tumefação do tecido mole localizada sobre o rebordo alveolar do elemento dentário 11, ainda não erupcionado. A tumefação revela coloração azulada pela presença de sangue no espaço tecidual e a criança não relata sintomatologia dolorosa.\nEssa alteração é denominada hematoma de erupção. Qual a conduta a ser instituída para a paciente?", "alts": ["Acompanhamento clínico, aguardando a erupção do elemento dentário.", "Drenagem do conteúdo da lesão.", "Biópsia excisional.", "Antibioticoterapia.", "Tratamento cirúrgico, por meio da remoção do tecido gengival que recobre o elemento dentário não erupcionado e tracionamento ortodôntico do dente 11."], "gab": "A", "fig": false}, {"ano": 2007, "n": 30, "enun": "Em uma criança do sexo masculino, 7 anos de idade, durante a remoção de tecido cariado no elemento dentário 55, ocorre exposição pulpar, ainda permanecendo dentina cariada em volta da polpa exposta. O dente apresenta dor à mastigação, não havendo evidência clínica e/ou radiográfica de alteração patológica irreversível da polpa.\nQual a conduta a ser seguida?", "alts": ["Tratamento expectante com óxido de zinco e eugenol.", "Capeamento pulpar direto com hidróxido de cálcio e restauração definitiva.", "Pulpotomia e restauração definitiva.", "Pulpectomia e restauração definitiva.", "Exodontia e confecção de mantenedor de espaço."], "gab": "C", "fig": false}, {"ano": 2007, "n": 32, "enun": "No quadro abaixo é feita uma comparação entre as metas propostas pela Organização Mundial de Saúde (OMS)/Federação\nDentária Internacional (FDI) para o ano 2000 com relação à cárie dentária e os resultados do mais recente levantamento epidemiológico realizado na população brasileira – Projeto SB Brasil 2003.\nNordeste\n%\nNorte\n%\nIdade\nBrasil 2003\n35,04\n34,92\n5 a 6 anos\nMeta OMS 2000\nBrasil 2003\n3,13\n3,19\n12 anos\nMeta OMS 2000\nBrasil 2003\n39,13\n45,07\n18 anos\nMeta OMS 2000\nBrasil 2003\n46,34\n49,97\n35 a 44 anos\nMeta OMS 2000\nBrasil 2003\n8,58\n11,07\n65 a 74 anos\nMeta OMS 2000\nBRASIL. Ministério da Saúde. Condições da saúde bucal da população brasileira 2002-2003. Resultados principais. Brasília, DF, 2004.\nCom base nos dados apresentados, qual a conclusão correta?", "alts": ["A cárie dentária se distribui igualmente na população, independente da macrorregião considerada e da idade dos indivíduos.", "A situação de saúde bucal da população brasileira, em relação à cárie, se encontra satisfatória, tendo o Brasil atingido grande parte das metas da OMS para o ano 2000.", "Aproximadamente 40% das crianças brasileiras de 5 anos de idade apresentam, pelo menos, um dente decíduo com experiência de cárie.", "Na população adulta há um aumento do componente “perdido”, sendo este fenômeno observado nas diferentes macrorregiões.", "As perdas dentárias são progressivas e precoces, embora a necessidade de algum tipo de prótese comece a surgir a partir dos 35 anos de idade."], "gab": "D", "fig": true}, {"ano": 2007, "n": 35, "enun": "O Código de Ética Odontológica regula os direitos e deveres dos profissionais, das entidades e das operadoras de planos de saúde. Considere os seguintes deveres:\nI – promover a saúde coletiva no desempenho de suas funções, cargos e cidadania, independente de exercer a profissão no setor público ou privado;\nII – garantir ao paciente ou ao seu responsável legal, acesso ao seu prontuário;\nIII – zelar pela saúde e pela dignidade do paciente;\nIV – manter atualizados os conhecimentos profissionais, técnico-científicos e culturais necessários ao pleno desempenho do exercício profissional.\nSegundo a regulamentação citada, são deveres fundamentais dos profissionais que atuam em Odontologia:", "alts": ["III e IV, apenas.", "I, II e III, apenas.", "I, III e IV, apenas.", "II, III e IV, apenas.", "I, II, III e IV."], "gab": "E", "fig": false}, {"ano": 2007, "n": 36, "enun": "“Em meio à atribulada rotina clínica a que são submetidos os cirurgiões-dentistas, a manutenção de toda a documentação referente ao atendimento executado nos pacientes reveste-se de aspectos éticos e legais cujo conhecimento é obrigatório.”\nSendo a documentação clínica uma das medidas mais efetivas para resguardar o profissional contra reclamações que podem ser infundadas, qual a medida profissional a ser adotada?", "alts": ["Guardar a documentação clínica por toda a vida do profissional ou do paciente.", "Descartar a documentação clínica em caso de abandono de tratamento.", "Arquivar a documentação clínica, no consultório ou clínica odontológica, não tendo o paciente direito de pleiteá-la.", "Considerar que a legislação vigente aceita o prontuário digital como substituto da documentação manuscrita.", "Deixar com o paciente as radiografias, eximindo o profissional de mais essa responsabilidade."], "gab": "A", "fig": false}], "D": [{"ano": 2023, "t": "Caso clínico: lesão na língua em UBS", "e": "Mulher de 68 anos, tabagista há mais de 40 anos, procura a UBS após visita da ACS por ferida na língua que não cicatriza há cerca de 1 ano, indolor. Retraída, usa antidepressivo. Exame: sangramento gengival, cálculo supragengival (17, 26, 27), raízes residuais com cárie (15 e 22), ausências (16, 12, 21, 24, 25 e todos os inferiores), prótese total inferior e PPR superior. Lesão em borda de língua (imagem na prova original).\n(a) Duas atribuições do ACS na PNAB relacionadas ao caso (3,0). (b) Hipótese diagnóstica e duas justificativas (3,0). (c) Conduta para confirmar a hipótese (1,0). (d) Plano de tratamento para adequação do meio bucal (3,0).", "p": "(a) Duas entre: identificar casos suspeitos e encaminhar à unidade de referência; conhecer e orientar sobre os serviços do território; diagnóstico demográfico/social/epidemiológico do território; promoção da saúde e prevenção por visitas e ações educativas; visitas domiciliares periódicas; informar datas de consultas e exames.\n(b) Carcinoma espinocelular (carcinoma de células escamosas/câncer de boca). Justificativas (duas): tabagismo; lesão indolor; evolução > 1 ano; bordos elevados; ulceração central; limites indefinidos; borda de língua.\n(c) Biópsia (incisional) com análise anatomopatológica.\n(d) Orientação de higiene oral; raspagem supragengival; exodontia dos dentes 15 e 22."}, {"ano": 2019, "t": "Cardiopata com prótese valvar e mucocele", "e": "Paciente de 68 anos, cardiopatia congênita tratada com prótese valvar, alérgico a benzetacil. Nódulo indolor, flutuante, em mucosa labial inferior após mordida; hipótese de mucocele; plano: enucleação e biópsia.\n(a) Risco do procedimento (2,0). (b) Conduta terapêutica (2,0). (c) Prescrição (3,0). (d) Justificativa (3,0).", "p": "(a) Endocardite bacteriana (infecciosa). (b) Profilaxia antibiótica. (c) Azitromicina 500 mg, 1 comprimido VO 1 hora antes OU clindamicina 600 mg (2 × 300 mg) VO 1 hora antes. (d) Paciente alérgico ao antibiótico de primeira escolha (betalactâmicos: penicilinas e cefalosporinas)."}, {"ano": 2019, "t": "Saúde pública: flúor e cárie aos 12 anos", "e": "Município de médio porte: CPO-D aos 12 anos de 2,80 e 35% livres de cárie (SB Brasil 2010: 2,07 e 44%). Água fluoretada em 90% da população, com 75% das amostras abaixo da concentração ótima; sem programa sistemático de escovação supervisionada.\n(a) Duas ações coletivas com flúor (5,0). (b) Uma estratégia individual com flúor (2,0). (c) Dois cuidados em crianças < 6 anos (3,0).", "p": "(a) Ajustar a concentração de flúor na água aos níveis ótimos; implantar heterocontrole/vigilância sistemática da água. (b) Higiene bucal com dentifrício fluoretado de 1.000 a 1.500 ppm. (c) Duas entre: supervisionar a escovação; pequena quantidade de dentifrício; estimular a cuspir o excesso; não deixar o dentifrício ao alcance."}, {"ano": 2019, "t": "Lesões orais em adulto jovem", "e": "Homem de 25 anos, solteiro, com lesões orais há mais de 20 dias; febre, dor de garganta e mal-estar. Há dois meses teve lesões indolores e endurecidas em língua e lábios, que sumiram em 4 semanas. Agora: áreas erosivas no dorso da língua e úlcera rasa de 12 mm na borda, com placa cinza adjacente.\n(a) Hipótese e duas justificativas (5,0). (b) Um exame para diagnóstico diferencial e outro para comprovação (3,0). (c) Prognóstico e tratamento (2,0).", "p": "(a) Sífilis secundária. Justificativas: lesões prévias indolores e endurecidas (sífilis primária); novas lesões com sintomas sistêmicos (febre, dor de garganta); paciente jovem e solteiro.\n(b) Diferencial: exame clínico completo, HIV ou biópsia. Comprovação: teste rápido, VDRL, FTA-Abs/Wassermann ou biópsia.\n(c) Bom prognóstico com tratamento adequado, desfavorável se abandonado. Tratamento com penicilina."}, {"ano": 2013, "t": "Receita, atestados e homeopatia", "e": "Menino de 7 anos com abscesso dentoalveolar, febril. O dentista prescreve antibiótico e os pais recusam tratamento alopático (homeopatia). Pedem atestados para os pais (trabalho) e para a criança (aula de educação física); o avô paga com cheque e pede recibo.\n(a) Como agir diante da exigência, respeitando a autonomia, mas documentando-se (7,0). (b) Quais documentos odontolegais (3,0).", "p": "(a) Emitir a receita em três vias, uma com aquiescência do responsável legal arquivada no prontuário; orientar sobre a gravidade e a importância do tratamento medicamentoso, registrando no prontuário com assinatura; opcionalmente encaminhar ao médico homeopata em duas vias, com assinatura do responsável.\n(b) 2 atestados trabalhistas; 1 atestado escolar; 1 recibo de honorários (ao avô); 1 receita."}, {"ano": 2013, "t": "Candidíase e sequência de tratamento", "e": "Homem de 53 anos, usuário da mesma prótese total superior há 13 anos, com sangramento gengival inferior e insatisfação estética. Restaurações inadequadas (32 distal, 31 distal, 41 mesial e distal, 42 mesial) e terceiros molares superiores inclusos (panorâmica). Lesão eritematosa em palato (imagem na prova original).\n(a) Diagnóstico e conduta (2,0). (b) Plano de tratamento na sequência correta (8,0).", "p": "(a) Candidíase (estomatite protética): remover o agente causador (higiene diária/remoção da prótese) e prescrever antifúngico tópico.\n(b) Fase 1, adequação do meio: tratar candidíase, raspagem, profilaxia, instrução de higiene, flúor tópico. Fase 2, cirúrgica/restauradora: exodontia dos terceiros molares superiores inclusos; restaurações em resina. Fase 3, reabilitação: prótese total superior e PPR inferior (ou implantes)."}, {"ano": 2013, "t": "Visita domiciliar e promoção da saúde", "e": "Estudantes visitam, com a ACS, família chefiada por mulher de 28 anos, fumante, diarista, mãe de três crianças (1, 3 e 5 anos) que frequentam a creche. Ela não procura a UBS por falta de tempo; o bairro tem pouco lazer; a alimentação em casa é muito diferente da servida na creche.\nRedija texto propondo no mínimo três atividades de promoção da saúde (10,0).", "p": "Três ou mais ações, por exemplo: habilidades individuais/autocuidado (escovação supervisionada, educação nutricional, combate ao fumo, encaminhamento à UBS); ações comunitárias (mobilizar por espaços de lazer, horta comunitária); espaços saudáveis (creches e escolas como lazer supervisionado); políticas públicas saudáveis (alimentação, lazer, saneamento, transferência de renda); reorientação dos serviços (horários alternativos, trabalho populacional)."}, {"ano": 2010, "t": "Anticoagulante oral e biópsia", "e": "Homem de 62 anos, prótese total superior, nódulo firme, rosado e liso na borda da língua, evolução de 3 meses. Biópsia excisional indicada; usa anticoagulante oral crônico, RNI 2,6.\n(a) Duas hipóteses diagnósticas (2,0). (b) Necessidade de suspender a medicação (3,0). (c) Dois procedimentos para controlar sangramento (3,0). (d) Duas condições sistêmicas que justificam anticoagulantes (2,0).", "p": "(a) Fibroma de irritação, hiperplasia fibrosa/fibroepitelial. (b) Com RNI ≤ 3 não é necessário suspender para cirurgia simples sob anestesia local: o risco da doença de base supera o benefício. (c) Sutura e compressão; ácido tranexâmico ou épsilon-aminocapróico em bochechos; evitar AINEs. (d) Válvulas protéticas, fibrilação atrial, trombose, embolia pulmonar. Fonte: BCSH."}, {"ano": 2010, "t": "Desgaste dental e DTM", "e": "Homem de 58 anos com dor articular constante, perda dos molares inferiores, desgaste moderado oclusal/incisal, abfrações cervicais em todos os pré-molares com sensibilidade e gengivite por controle de biofilme deficiente. Formule a sequência de tratamento (10,0).", "p": "Enceramento diagnóstico para nova dimensão vertical; tratamento da gengivite e controle do biofilme; PPR (ou implantes com próteses fixas, com tomografia prévia); resina composta nas faces oclusais/incisais; resina nas lesões cervicais; dispositivo estabilizador oclusal; acompanhamento até estabilização. Ref.: Coelho-de-Souza et al., Fundamentos de Clínica Integral em Odontologia (2009)."}, {"ano": 2010, "t": "Abordagem sócio-odontológica", "e": "A partir do organograma de necessidade de tratamento (normativo → relacionada com propensão → baixa/média/alta propensão, com ESB/PSP), responda: (a) questão crucial na medição da necessidade normativa; (b) tipos de lesões contempladas; (c) enfoque do tratamento no nível de propensão; (d) o que os planejadores devem fazer após calcular a necessidade (2,5 cada). Ref.: Pinto, Saúde Bucal Coletiva (2008).", "p": "(a) Se a condição é de risco de vida ou crônica progressiva; se há risco de vida, saltam-se as etapas iniciais. (b) Risco de vida (câncer bucal, lesões pré-cancerosas, infecções graves) e condições crônicas progressivas. (c) Probabilidade de sucesso, usando melhores evidências para classificar em baixa, média ou alta propensão. (d) Converter as estimativas em unidades de tempo e considerar habilidades e recursos humanos."}, {"ano": 2007, "t": "Ginkgo biloba e cirurgia periodontal", "e": "Mulher de 54 anos, clareamento de anteriores; necessita cirurgia periodontal para recobrimento radicular (23) e troca de resina (22). Usa Ginkgo biloba; tempo de sangramento 11 min (ref. 1 a 3) e INR 1,6. Formule sequência de tratamento, justificando (10,0).", "p": "1) Suspender o ginkgo (cerca de 10 dias) antes da cirurgia, por efeito anticoagulante. 2) Cirurgia periodontal após novo coagulograma normal. 3) Clareamento, para definir a cor final. 4) Restaurar o 22 depois, com a cor já alcançada."}, {"ano": 2007, "t": "Espaço biológico e aumento de coroa clínica", "e": "(a) Identifique as três estruturas do espaço biológico no esquema (1,5). (b) Duas situações com indicação de aumento de coroa clínica (1,5). (c) Etapas do procedimento cirúrgico (7,0).", "p": "(a) Sulco gengival, epitélio juncional e inserção conjuntiva. (b) Duas entre: cárie subgengival; fratura subgengival; término protético subgengival; perfuração; desgaste patológico; sobrecontorno; injúrias no preparo/moldagem. (c) Anamnese, anestesia, incisão, elevação do retalho, osteotomia, mensurações e sutura."}, {"ano": 2007, "t": "Criança de 6 anos na UBS", "e": "Menina de 6 anos; renda familiar R$ 315, pais com 1º grau incompleto, sem saneamento, dieta cariogênica, escovação não diária, sangramento gengival, mancha branca em 53, 63, 73, 83, cárie oclusal profunda em 75, 84 e 85 e molares 36 e 46 em erupção com mancha ativa.\n(a) Três fatores de risco (3,0). (b) Três medidas educativas/preventivas (3,0). (c) Tratamento para 85 e 36 (4,0).", "p": "(a) Três entre: renda; escolaridade dos pais; ausência de saneamento/água fluoretada; falta de acesso odontológico; higiene inadequada; dieta cariogênica. (b) Educação em saúde; instrução de higiene; orientação de dieta; dentifrício fluoretado; profilaxia profissional. (c) Dente 85: material provisório (OZE ou CIV) ou restauração definitiva (CIV, compômero, resina). Dente 36: flúor (gel, espuma ou verniz) ou selante ionomérico."}, {"ano": 2007, "t": "Saúde da Família e integralidade", "e": "Município de 55.000 habitantes sem água fluoretada, 8 USF (7 ESB modalidade I e 1 modalidade II), cobertura ESF 41% e ESB 29%, 1 CEO tipo 2. CPO-D de 3,67 aos 12 anos e 23,44 aos 35 a 44 anos, com 74,73% de componente perdido. Cite quatro ações no PSF para garantir integralidade e justifique (10,0).", "p": "Quatro entre: ampliar equipes de SF e SB e a cobertura; garantir referência e contrarreferência (CEO); acolhimento; integrar a saúde bucal às ações da UBS; vigilância (fluoretação da água, monitorar ceo/CPO-D); ampliar ações educativas e preventivas; delegar ações coletivas ao pessoal auxiliar. Justificar com os dados (cobertura baixa, perdas dentárias altas)."}], "S": [{"f": "Fase 1", "t": "Princípios do SUS", "e": "Sobre os princípios do SUS: I. A integralidade abrange promoção, prevenção, tratamento e reabilitação. II. A equidade consiste em tratar todos de forma idêntica, independentemente da necessidade. III. A participação da comunidade é diretriz do SUS. Está correto o que se afirma em:", "a": ["I, apenas.", "II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "g": "C", "c": "Equidade é tratar desigualmente os desiguais, conforme a necessidade."}, {"f": "Fase 1", "t": "Fluoretação da água", "e": "A fluoretação da água de abastecimento é medida coletiva de prevenção da cárie PORQUE mantém baixa concentração constante de flúor na cavidade bucal, reduzindo a desmineralização e favorecendo a remineralização.", "a": ["As duas são verdadeiras e a segunda justifica a primeira.", "As duas são verdadeiras, mas a segunda não justifica a primeira.", "A primeira é verdadeira e a segunda é falsa.", "A primeira é falsa e a segunda é verdadeira.", "As duas são falsas."], "g": "A", "c": "Ref.: Política Nacional de Saúde Bucal e literatura sobre mecanismo tópico do flúor."}, {"f": "Fase 1", "t": "Mancha branca ativa", "e": "Criança de 5 anos com manchas brancas opacas e rugosas nas faces vestibulares dos incisivos, sem cavitação, com biofilme visível. A conduta mais adequada é:", "a": ["restauração com resina composta.", "remoção seletiva de tecido cariado.", "controle do biofilme, orientação dietética, flúor tópico e monitoramento.", "preparo cavitário seguido de selante.", "exodontia dos elementos afetados."], "g": "C", "c": "Lesão não cavitada: abordagem não invasiva."}, {"f": "Fase 1", "t": "Periodontite: estadiamento e grau", "e": "Na classificação de 2018 (AAP/EFP), a periodontite é caracterizada por estágio e grau. O grau:", "a": ["indica a extensão de dentes afetados.", "reflete a gravidade da perda de inserção.", "define a necessidade de cirurgia.", "indica o risco de progressão, considerando fatores como tabagismo e diabetes.", "substitui o estágio na definição do caso."], "g": "D", "c": "O estágio indica gravidade e complexidade; o grau, a taxa de progressão e os fatores de risco."}, {"f": "Fase 1", "t": "Anafilaxia no consultório", "e": "Após antibiótico, o paciente apresenta urticária, edema de glote e hipotensão. A medida inicial prioritária é:", "a": ["anti-histamínico por via oral.", "adrenalina intramuscular.", "corticoide por via oral.", "apenas posicionar o paciente sentado.", "aguardar a evolução do quadro."], "g": "B", "c": "A adrenalina IM é o tratamento de primeira linha da anafilaxia."}, {"f": "Fase 1", "t": "Radioproteção (ALARA)", "e": "De acordo com o princípio ALARA em radiologia odontológica, é medida adequada:", "a": ["repetir a radiografia sempre que possível.", "dispensar avental plumbífero em exames intraorais.", "usar colimação retangular, receptores sensíveis e a menor exposição que gere imagem diagnóstica.", "indicar radiografias periódicas sem avaliação de risco.", "aumentar o tempo de exposição para evitar repetições."], "g": "C", "c": "ALARA: tão baixo quanto razoavelmente exequível."}, {"f": "Fase 1", "t": "Prontuário odontológico", "e": "Segundo o Código de Ética Odontológica, o prontuário:", "a": ["pode ser descartado após 2 anos.", "pertence só ao profissional e não pode ser fornecido ao paciente.", "deve ser conservado pelo prazo mínimo de 10 anos.", "é dispensável em atendimentos de rotina.", "pode ser divulgado a terceiros sem autorização."], "g": "C", "c": "Confira a redação vigente do Código antes de publicar."}, {"f": "Fase 1", "t": "Úlcera em língua", "e": "Homem de 58 anos, tabagista e etilista, com úlcera indolor e endurecida em borda lateral de língua há 4 semanas. A conduta mais adequada é:", "a": ["bochechos antissépticos e retorno em 60 dias.", "corticoide tópico por 30 dias.", "polimento de dente adjacente e reavaliação.", "biópsia incisional e encaminhamento para diagnóstico.", "observação, por ser lesão traumática."], "g": "D", "c": "Úlcera persistente > 2 a 3 semanas com fatores de risco exige biópsia."}, {"f": "Fase 1", "t": "CEO na PNSB", "e": "Na Política Nacional de Saúde Bucal, os Centros de Especialidades Odontológicas (CEO) atuam como:", "a": ["porta de entrada preferencial do sistema.", "serviços exclusivos de urgência.", "referência da atenção secundária (endodontia, periodontia, cirurgia oral, diagnóstico de câncer bucal).", "unidades privadas conveniadas.", "substitutos da Atenção Primária."], "g": "C", "c": "A porta de entrada é a Atenção Primária."}, {"f": "Fase 1", "t": "Níveis de evidência", "e": "Para a pergunta sobre eficácia de um tratamento, o desenho com maior nível de evidência é:", "a": ["relato de caso.", "opinião de especialista.", "estudo de coorte.", "revisão sistemática com metanálise de ensaios clínicos randomizados.", "estudo transversal."], "g": "D", "c": ""}], "SD": {"f": "Fase 1", "t": "Equipe de Saúde Bucal em município rural", "e": "Município rural sem água fluoretada, com alta prevalência de cárie em escolares. Você é o cirurgião-dentista da ESB da ESF. (a) Proponha duas ações coletivas de promoção e prevenção (4,0). (b) Explique como a equidade orienta a priorização (3,0). (c) Cite um indicador de monitoramento (3,0).", "p": "(a) Escovação supervisionada com dentifrício fluoretado, aplicação tópica de flúor, ações educativas. (b) Priorizar grupos de maior risco e vulnerabilidade, com mais recursos a quem mais precisa. (c) ceo-d/CPO-D, percentual de escolares livres de cárie ou cobertura de primeira consulta programática."}};const $=s=>document.querySelector(s);
let tab='obj',yr='todos',idx=0,sim=null,ans={};
const tabs=[['obj','Objetivas'],['sim','Simulado'],['dis','Discursivas'],['sug','Sugeridas']];
function nav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';idx=0;render()">${t[1]}</button>`).join('')}
function qhtml(q,k,done){const fig=/figura|imagem|gráfico|quadro|tabela|abaixo|a seguir/i.test(q.enun||'')&&q.ano;
return `<div class="card"><div class="tag">${q.ano?'ENADE '+q.ano+' · questão '+q.n:q.f}</div><p class="stem">${esc(q.enun||q.e)}</p>${fig?'<div class="tag">Pode haver figura ou tabela na prova original.</div>':''}`+
(q.alts||q.a).map((a,i)=>{const L='ABCDE'[i],g=q.gab||q.g;let c='';if(done[k]){if(L==g)c='ok';else if(L==done[k])c='no'}return `<button class="opt ${c}" onclick="pick('${k}','${L}')"><b>${L}</b> ${esc(a)}</button>`}).join('')+
(done[k]?`<div class="note">${(q.gab||q.g)?'Gabarito: '+(q.gab||q.g):'Questão anulada pelo INEP.'}${q.c?'\n'+esc(q.c):''}</div>`:'')+'</div>'}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function pick(k,L){if(ans[k])return;ans[k]=L;render(true)}
function render(keep){nav();const v=$('#v');let h='';
if(tab=='obj'){const ys=['todos',2023,2019,2016,2013,2007];h+='<div class="row">'+ys.map(y=>`<button class="chip ${yr==y?'on':''}" onclick="yr='${y}';idx=0;render()">${y}</button>`).join('')+'</div>';
const L=DB.Q.filter(q=>yr=='todos'||q.ano==yr);if(idx>=L.length)idx=0;const q=L[idx];h+=`<div class="mut">${idx+1} de ${L.length}</div>`+qhtml(q,q.ano+'-'+q.n,ans)+`<div class="row"><button class="go" onclick="idx=(idx-1+${L.length})%${L.length};render()">Anterior</button><button class="go" onclick="idx=(idx+1)%${L.length};render()">Próxima</button></div>`}
if(tab=='sim'){if(!sim)h+=`<div class="card">Simulado com 10 questões sorteadas do banco.<div class="row"><button class="go" onclick="sim=[...DB.Q].sort(()=>Math.random()-.5).filter(q=>q.gab).slice(0,10);ans={};idx=0;render()">Começar</button></div></div>`;
else{const q=sim[idx],k='s'+idx,done=Object.keys(ans).length;h+=`<div class="mut">Questão ${idx+1} de 10</div>`+qhtml(q,k,ans)+`<div class="row">${idx<9?`<button class="go" onclick="idx++;render()">Próxima</button>`:`<button class="go" onclick="fim()">Ver resultado</button>`}</div>`}}
if(tab=='dis')h+=DB.D.sort((a,b)=>b.ano-a.ano).map((d,i)=>`<div class="card"><div class="tag">ENADE ${d.ano} · discursiva</div><b>${esc(d.t)}</b><p class="stem">${esc(d.e)}</p><details><summary>Padrão de resposta</summary><div class="note">${esc(d.p)}</div></details></div>`).join('')+'<div class="mut">Questões de Formação Geral e a prova de 2016 (sem padrão de resposta enviado) não estão incluídas.</div>';
if(tab=='sug')h+='<div class="mut">Questões inéditas, no estilo ENADE. Confira normas e referências antes de usar oficialmente.</div>'+DB.S.map((q,i)=>qhtml(q,'g'+i,ans)).join('')+`<div class="card"><div class="tag">Fase 1 · discursiva</div><b>${esc(DB.SD.t)}</b><p class="stem">${esc(DB.SD.e)}</p><details><summary>Padrão de resposta</summary><div class="note">${esc(DB.SD.p)}</div></details></div>`;
v.innerHTML=h;if(!keep)scrollTo(0,0)}
function fim(){let ok=0;sim.forEach((q,i)=>{if(ans['s'+i]==q.gab)ok++});$('#v').innerHTML=`<div class="card"><b>Resultado: ${ok} de 10</b><div class="row"><button class="go" onclick="sim=null;render()">Novo simulado</button></div></div>`}
render();
</script></body></html>
