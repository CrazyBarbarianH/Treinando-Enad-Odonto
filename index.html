0, "enun": "É correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "D", "fig": false}, {"ano": 2019, "n": 32, "enun": "Um menino de 4 anos de idade foi levado à Unidade\nBásica de Saúde para tratamento odontológico.\nAo exame clínico intrabucal, o cirurgião-dentista verificou que a criança apresentava lesões de cárie cavitadas em todos os dentes superiores e molares inferiores, com sensibilidade dolorosa durante a mastigação e a escovação. Na anamnese, a mãe relatou que a criança ainda tomava uma média de\n4 mamadeiras com leite e açúcar durante a noite e que ela oferecia as mamadeiras porque a criança não estava se alimentando direito. Com relação aos hábitos de higiene, relatou que a criança escovava os dentes sozinha 2 vezes ao dia (depois do almoço e antes de dormir), com creme dental sem flúor, porque a água de abastecimento já era tratada com flúor e a criança gostava de “comer” o creme dental. Informou, também, que a dieta da criança era livre e com alto consumo de açúcar.", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "D", "fig": false}, {"ano": 2019, "n": 34, "enun": "A Atenção Primária em Saúde requer que os serviços de saúde desenvolvam arranjos organizacionais e modelos de atenção compatíveis com as transições demográficas e epidemiológicas que levam ao envelhecimento populacional e ao aumento de doenças crônicas não transmissíveis, condições que requerem o desenvolvimento de autonomia e cuidados integrais ao longo da vida.\nMENDES, E. V. O cuidado das condições crônicas na atenção primária à saúde: o imperativo da consolidação da estratégia de saúde da família. Brasília: OPAS/OMS, 2012 (adaptado).", "alts": ["I, apenas.", "II e III, apenas.", "II e IV, apenas.", "I, III e IV, apenas.", "I, II, III e IV."], "gab": "E", "fig": false}, {"ano": 2016, "n": 6, "enun": "A Lei n. 8.213/1991 assegura a contratação de pessoas com deficiência tanto no serviço público como em empresas privadas que empreguem cem trabalhadores ou mais. Todavia, ainda não é tão simples a inserção dessas pessoas no mercado de trabalho, como ilustra a figura abaixo.\nDisponível em: <www.multiplicandocidadania.com.br>.\nAcesso em: 30 jul. 2016.\nA respeito da inserção, no mercado de trabalho, de pessoas com deficiência, avalie as afirmações a seguir.\nI. Assegurada por lei, a contratação de profissionais com deficiência é cada vez mais frequente no serviço público, contudo a regulamentação de cotas para esses profissionais não abrange as empresas privadas.\nII. As pessoas com deficiência passaram a ter mais chances de inserção no mercado de trabalho, mas, em geral, elas ainda enfrentam preconceito nos locais de trabalho.\nIII. Um dos maiores empecilhos para a inserção de profissionais com deficiência no mercado de trabalho é de natureza cultural e envolve estereótipos e discriminação.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "gab": "D", "fig": true}, {"ano": 2016, "n": 7, "enun": "A articulação indígena-quilombola vem-se consolidando em Oriximiná, no Pará, desde 2012, com o objetivo de incentivar a parceria entre índios e quilombolas frente a novos desafios comuns.\nA aliança possibilitou, em 2015, a reaproximação entre índios da Terra Indígena Kaxuyana-Tunayana e os quilombolas da Terra Quilombola Cachoeira\nPorteira, cujas relações, no processo de regularização de suas terras, haviam assumido ares de conflito.\nReunidos no Quilombo Abuí, escolhido como local neutro e livre de influências externas, em maio de\n2015, lideranças indígenas e quilombolas de ambas as terras, com a mediação de lideranças quilombolas de outras comunidades, acordaram os limites territoriais para fins de regularização fundiária.\nO acordo foi oficializado junto ao Ministério Público\nFederal e ao Ministério Público Estadual.\nDisponível em: <http://www.quilombo.org.br>.\nAcesso em: 29 ago. 2016 (adaptado).\nA análise dessa situação evidencia a importância da", "alts": ["autodeterminação dos povos tradicionais na definição de seus limites territoriais.", "intervenção prévia do Estado em situações de potencial conflito entre povos tradicionais.", "urgência de regularização das terras quilombolas e indígenas, priorizando-se áreas isentas de conflitos.", "definição, por atores externos, dos desafios comuns a serem enfrentados pelos povos tradicionais.", "participação do Ministério Público nas negociações de limites territoriais entre quilombolas e indígenas."], "gab": "A", "fig": false}, {"ano": 2016, "n": 11, "enun": "Uma mulher com 80 anos de idade é portadora da Doença de Alzheimer em grau intermediário. O\n“esquecimento” fez com que ela abandonasse várias atividades do cotidiano. Sua condição piorou progressivamente, até que surgiram alucinações visuais e ideias delirantes, como ilusões de roubo.\nAtualmente, precisa de ajuda em todas as atividades, exceto na de alimentar. A família procurou o cirurgião- dentista por encaminhamento do geriatra. A idosa tem duas filhas casadas, que trabalham e se revezam nos cuidados à mãe. As imagens abaixo ilustram as condições clínicas encontradas.\nMIRANDA, A. F. et al. Saúde Bucal aos Pacientes do Centro de Medicina do Idoso do Hospital Universitário de Brasília: uma visão especial da\nOdontologia no contexto multidisciplinar. Revista Meta: Avaliação, v. 4, n. 10, p. 68-77, 2012 (adaptado).\nConsiderando o caso apresentado, avalie as afirmações a seguir, relativas às condutas a serem adotadas pelo cirurgião-dentista.\nI. Encaminhar solicitação escrita ao médico geriatra de autorização para o início do tratamento da paciente, o qual envolverá raspagem dental, profilaxia profissional e orientação de higiene bucal.\nII. Solicitar às filhas que aguardem na sala de espera, enquanto estiver orientando a paciente sobre condutas de higiene bucal e da prótese.\nIII. Comunicar-se com outros profissionais da saúde, para abordagem em conjunto, a fim de contornar questões relacionadas ao engajamento da família na prevenção das patologias bucodentárias da paciente.\nIV. Orientar as filhas sobre técnicas de higiene bucal e da prótese dentária e solicitar à responsável legal pela paciente que assine o Termo de Consentimento Livre e Esclarecido/Informado.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "III e IV.", "I, II e IV.", "II, III e IV. 2016"], "gab": "C", "fig": true}, {"ano": 2016, "n": 12, "enun": "A bulimia é uma síndrome caracterizada por padrão de hiperfagia seguido por condutas compensatórias inapropriadas para evitar o ganho de peso, como a regurgitação autoinduzida, o uso abusivo de laxantes, diuréticos, anorexígenos, dietas severas e prática excessiva de exercícios físicos.\nDAV, P. et al. Bulimia: manifestações bucais e atenção odontológica.\nRGO - Rev Gaúch Odontol., v. 58, n. 3, p. 381-385, jul./set. 2010 (adaptado).\nA partir dessa definição de bulimia, avalie as afirmações a seguir.\nI. A neutralização dos ácidos gástricos imediatamente após o vômito, com a utilização de antiácidos, é medida preventiva eficaz que minimiza perdas estruturais nos dentes.\nII. Os índices de cárie em pacientes bulímicos são diretamente associados à frequência de vômitos, a despeito do padrão da hiperfagia e da presença de xerostomia.\nIII. O tratamento odontológico de pacientes com desordens alimentares é, muitas vezes, iniciado tardiamente, e, mesmo após a cura/controle da desordem alimentar, a perda de estrutura dental é irreversível.\nÉ correto o que se afirma em", "alts": ["II, apenas.", "III, apenas.", "I e II, apenas.", "I e III, apenas.", "I, II e III."], "gab": "D", "fig": false}, {"ano": 2016, "n": 13, "enun": "Pacientes com 60 anos de idade ou mais, portadores de diabetes, participaram de um grupo de promoção do envelhecimento ativo e saudável realizado pela\nUnidade Básica de Saúde. Diante da proposta de cardápio apresentada pela nutricionista, manifestaram não ter condições de seguir a dieta com mais fibra, pois tinham dificuldades para mastigar e, na maioria das vezes, optavam por uma alimentação mais pastosa.\nIsso é justificado pelo fato do CPO-D médio para esta faixa etária no Brasil ser de 27,5, do qual o componente perdido representa 91,9% do total do índice, o que indica uma grande necessidade de próteses dentárias.\nConsiderando esse contexto, avalie as asserções a seguir e a relação proposta entre elas.\nI. Com o objetivo de atender à Política Nacional de Saúde da Pessoa Idosa, que preconiza a atenção integral para essa população, a Equipe de Saúde Bucal deve confeccionar, na atenção básica, as próteses dentárias necessárias à reabilitação e à melhora da mastigação dos idosos, bem como, atuar em conjunto com os outros profissionais de saúde envolvidos na atenção à saúde do idoso.\nPORQUE\nII. Na atenção básica, devem ser incorporaradas ações que promovam a melhoria da resolutividade da atenção à pessoa idosa com abordagem global, interdisciplinar e multidimensional, que levam em conta a interação entre os fatores físicos, psicológicos e sociais que influenciam a saúde do idoso.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "A", "fig": false}, {"ano": 2016, "n": 14, "enun": "Uma mulher com 36 anos de idade, apresentando dor no elemento 16, buscou atendimento odontológico.\nAo exame físico, observou-se a presença de biofilme espesso e cálculo em quase todos os dentes, além de sangramento gengival. O elemento 16 apresentou sensibilidade exacerbada à percussão e teste de vitalidade pulpar negativo, apesar da ausência de cárie ou restauração profunda.\nFoi constatada bolsa periodontal verdadeira com\n7 mm na face distal do elemento 16, associada à secreção purulenta. Pelo exame radiográfico, verificou-se perda óssea do tipo vertical associada à face distal do elemento 16.\nNessa situação, o diagnóstico e o tratamento adequados para o caso dessa paciente são", "alts": ["periodontite apical aguda; tratamento endodôntico e antibioticoterapia.", "lesão endoperiodontal; tratamento endodôntico e antibioticoterapia.", "abscesso periodontal; drenagem e antibioticoterapia.", "abscesso periodontal; raspagem com acesso cirúrgico e antibioticoterapia.", "lesão endoperiodontal; tratamento endodôntico e tratamento periodontal."], "gab": "E", "fig": true}, {"ano": 2016, "n": 15, "enun": "Um menino com 8 anos de idade foi levado pela mãe para uma Unidade Básica de Saúde (UBS), com queixa de sangramento gengival e ardência na língua.\nNa anamnese, foi relatado que o sangramento ocorre durante a escovação dos dentes, que, por isso, não tem sido realizada ultimamente. Quanto à ardência na língua, que iniciara há um mês, o menino relatou piora ao comer chocolate. Conforme relato da mãe, a criança consome muitos alimentos açucarados durante o dia. No prontuário da criança observaram-se as condições de obesidade e anemia. No exame intrabucal, foi observada erosão da ponta até a parte central do dorso da língua, além de grande quantidade de biofilme dental e sangramento gengival, várias lesões de cárie extensas e manchas brancas opacas na região cervical das faces vestibulares dos dentes.\nCom relação ao caso apresentado, avalie as afirmações a seguir.\nI. O sangramento está associado à gengivite pela presença de biofilme e à higiene bucal da criança.\nII. A obesidade da criança e a presença de várias lesões de cárie extensas e de manchas brancas opacas nos dentes têm fatores de risco em comum, como o consumo excessivo de alimentos ricos em carboidratos.\nIII. A erosão na língua sugere relação com a anemia ferropriva, que pode resultar em perda das papilas filiformes.\nIV. A erosão lingual está associada à diminuição excessiva de pH bucal, decorrente da fermentação de carboidratos pela microbiota residente.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "II e IV.", "III e IV.", "I, II e III.", "I, III e IV."], "gab": "D", "fig": false}, {"ano": 2016, "n": 16, "enun": "Os pacientes cardiopatas apresentam alterações de origem congênita (comunicação interatrial e interventricular, defeitos do septo atrioventricular, anomalia de artérias coronárias), ou adquirida (hipertensão arterial, coronariopatias, aterosclerose, arritmias, cardiomiopatias, insuficiência cardíaca congestiva). As adquiridas são mais frequentemente encontradas em indivíduos adultos, e são cada vez mais comuns no ambiente odontológico, inspirando uma série de cuidados e rotinas especiais.\nConsiderando essas informações e o atendimento odontológico ao paciente cardiopata com alterações adquiridas, avalie as afirmações a seguir.\nI. Recomenda-se, em pacientes com arritmias cardíacas, a antibioticoterapia profilática para evitar endocarditite infecciosa.\nII. Recomenda-se a utilização de sedativos pré e trans-operatórios, anestesia local potente e analgesia pós-operatória para minimizar o estresse do paciente.\nÉ correto apenas o que se afirma em\nA I e II.\nB I e IV.\nC II e III.\nIII. Deve-se evitar o uso de anestésicos que\nD I, III e IV. contenham vasoconstritores do grupo das\nE II, III e IV. aminas simpatomiméticas como a epinefrina, norepinefrina e levonordefrina, em pacientes Área Livre com arritmias cardíacas.\nIV. Deve-se prescrever anti-inflamatórios não- esteroidais para pacientes arrítmicos que fazem uso de betabloqueadores não seletivos (propranolol), pois sua interferência no mecanismo de ação desta droga é clinicamente insignificante.\nÉ correto apenas o que se afirma em", "alts": ["I e III.", "II e III.", "II e IV.", "I, II e IV.", "I, III e IV."], "gab": "B", "fig": false}, {"ano": 2016, "n": 18, "enun": "Um homem com 49 anos de idade procura atendimento odontológico com queixa de dor intolerável, pulsátil, constante e difusa na região de molares inferiores, lado esquerdo. O paciente mostra-se debilitado e relata estar “gripado”, ter tido febre alta nos últimos dois dias, dores no corpo e “atrás dos olhos”, apresentando um quadro sistêmico compatível com dengue. Após exame clínico, foi estabelecido o diagnóstico de pulpite irreversível no dente 36 e realizado o tratamento endodôntico.\nConsiderando a opção de prescrição medicamentosa para conforto e controle da dor pós-operatória, qual é o fármaco de eleição?", "alts": ["Ácido acetilsalicílico.", "Ibuprofeno.", "Dipirona.", "Nimesulida.", "Diclofenaco."], "gab": "C", "fig": true}, {"ano": 2016, "n": 19, "enun": "Mãe descobre que filho foi estuprado após dentista achar doença na boca\nUma mãe descobriu que o filho de 6 anos foi estuprado depois que o levou a um cirurgião-dentista no posto de saúde. O garoto tinha uma lesão no lábio inferior e o profissional suspeitou que ele tinha uma doença sexualmente transmissível. O cirurgião-dentista que fez o atendimento à vítima conta que a mãe achava que a lesão era resultado de mordidas. Entretanto, a lesão tinha por características: “verruga” com mancha branca, aspecto papilífero, semelhante a couve flor, pediculado e assintomático.\nDisponível em: <http://g1.globo.com>.\nAcesso em: 26 jul. 2016 (adaptado).\nDiante do caso apresentado, a hipótese diagnóstica e a conduta adequada do profissional são", "alts": ["herpes; notificar a suspeita de maus tratos ao Conselho Tutelar.", "herpes; notificar a suspeita de maus tratos ao serviço social da Unidade Básica de Saúde.", "HPV; notificar a suspeita de maus tratos ao Conselho Tutelar.", "HPV; notificar a suspeita de maus tratos ao serviço social da Unidade Básica de Saúde.", "sífilis; notificar a suspeita de maus tratos à autoridade policial local."], "gab": "C", "fig": false}, {"ano": 2016, "n": 20, "enun": "Um homem com 25 anos de idade compareceu a um consultório odontológico, sem horário agendado, relatando limitação de abertura bucal, dor e inchaço na região inferior da face, conforme ilustra a Figura 1.\nNa anamnese, relatou estado febril, dificuldade para se alimentar havia dois dias. Informou não ser portador de doenças sistêmicas. Ao exame físico, observaram-se trismo e edema extraoral localizado, não consistente e com ponto de flutuação. O teste de vitalidade pulpar foi positivo no dente 37. A imagem radiográfica dos dentes 36 e 37 é apresentada na Figura 2.\nFigura 1\nPara o caso apresentado, qual deverá ser a sequência correta do plano de tratamento?", "alts": ["Medicação sistêmica com antibiótico, analgésico e relaxante muscular; reagendamento para 24 horas; drenagem extraoral; extração do dente 36 e reabilitação protética.", "Medicação sistêmica com antibiótico, analgésico e relaxante muscular; reagendamento para 24 horas; drenagem extraoral; abertura endodôntica do dente 37; extração do dente 36; endodontia do dente 37 e reabilitação protética.", "Drenagem extraoral; medicação sistêmica com antibiótico, analgésico e relaxante muscular; retorno a cada 24 horas, para troca de curativo extraoral e acompanhamento da abertura bucal; abertura endodôntica do dente 37; extração do dente 36; endodontia do dente 37 e reabilitação protética.", "Drenagem extraoral; abertura endodôntica do dente 37; medicação sistêmica com antibiótico, analgésico e relaxante muscular; retorno a cada 24 horas, para troca de curativo extraoral e acompanhamento da abertura bucal; extração do dente 36; endodontia do dente 37 e reabilitação protética.", "Medicação sistêmica com antibiótico; drenagem extraoral; medicação com analgésico e relaxante muscular; retorno a cada 24 horas para troca de curativo extraoral e acompanhamento da abertura bucal; extração do dente 36 e reabilitação protética. Figura 2"], "gab": "E", "fig": true}, {"ano": 2016, "n": 22, "enun": "De acordo com a Política Nacional de Saúde do Idoso, o atendimento na atenção básica domiciliar tem como objetivo promover a integração com os demais níveis de atenção e garantir a integralidade por meio da aplicação de modalidades que atendam às necessidades dessa população, a partir de condutas multidisciplinares, sempre que possível. O cirurgião-dentista, ao se deparar com casos de pacientes idosos que necessitam de atendimento domiciliar, deve estar preparado e qualificado para o atendimento, para que o plano de tratamento seja executado de maneira individualizada e multidisciplinar.\nROCHA, D. A.; MIRANDA, A. F. Atendimento odontológico domiciliar aos idosos: uma necessidade na prática multidisciplinar em saúde: revisão de literatura. Rev. Bras. Geriatr. Gerontol. v. 16, n. 1, p. 181-189, 2013 (adaptado).\nA partir dessas informações, relativas ao atendimento domiciliar odontológico, avalie as afirmações a seguir.\nI. Idosos submetidos a intervenções cirúrgicas cardíacas requerem maior atenção nos procedimentos invasivos.\nII. Idosos diabéticos apresentam risco maior de doença periodontal com perda de tecido de suporte dentário, com progressão rápida e agressiva.\nIII. Idosos hipertensos controlados apresentam risco aceitável no tratamento odontológico, a ser realizado sob monitorização da pressão arterial.\nIV. Idosos com saúde bucal insatisfatória e dificuldade de deglutição apresentam fator de risco para contaminações sistêmicas, relacionado à aspiração de conteúdo bacteriano da cavidade bucal e consequente contaminação do trato respiratório inferior.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "I e IV, apenas.", "II e III, apenas.", "II, III e IV, apenas.", "I, II, III e IV."], "gab": "E", "fig": false}, {"ano": 2016, "n": 23, "enun": "Um homem com 50 anos de idade, portador de insuficiência renal crônica terminal e dependente de hemodiálise, foi encaminhado à avaliação odontológica, como parte dos cuidados prévios ao transplante renal.\nQual é a conduta adequada a ser adotada pelo cirurgião-dentista para o manejo desse paciente?", "alts": ["Realizar cobertura antibiótica, devido ao risco aumentado de endocardite bacteriana.", "Suspender o uso de heparina um dia antes dos procedimentos invasivos.", "Realizar os procedimentos invasivos seis meses após o transplante.", "Realizar procedimentos de urgência, evitando anestésicos locais.", "Eliminar os focos de infecção dentária, presentes e potenciais."], "gab": "E", "fig": false}, {"ano": 2016, "n": 26, "enun": "Paciente de 43 anos de idade, do sexo masculino, relatou, em atendimento odontológico, sangramento na gengiva e quebra de uma restauração na região superior direita. Relatou ser diabético controlado. Ao exame físico, verificam-se fratura coronária no dente 14, sobrecontorno na restauração do dente 24, sangramento generalizado à sondagem, bolsas periodontais no dente 36 com 9 mm de profundidade e envolvimento de furca e, no dente 32, com 8 mm de profundidade de sondagem na distal e vitalidade pulpar positiva.\nConsiderando-se o quadro clínico e a imagem da radiografia panorâmica acima, a conduta inicial adequada é", "alts": ["raspagem e alisamento radicular; correção das irregularidades das restaurações, para controle de foco infeccioso.", "retratamento endodôntico do dente 14, para controle de foco infeccioso associado ao alto risco de disseminação sistêmica.", "adoção de protocolo de uso de antibiótico 24 horas antes da intervenção, dada a condição de paciente diabético.", "tratamento endodôntico do dente 32, devido ao alto grau de falsos positivos em testes de vitalidade pulpar.", "exodontia do dente 36, por se tratar de lesão endoperiodontal em paciente diabético. 2016"], "gab": "A", "fig": true}, {"ano": 2016, "n": 27, "enun": "Um cirurgião-dentista recentemente contratado para compor a Equipe de Saúde da Família identificou, em uma comunidade, alta prevalência de traumatismos dentários em adolescentes. Para uma abordagem coletiva, proativa e empreendedora neste território, os serviços de saúde devem organizar, programar e manter diversas ações de vigilância do traumatismo dentário.\nCom relação a ações de planejamento em um serviço de atendimento de traumatismo dentário, em uma abordagem coletiva, avalie as afirmações a seguir.\nI. As equipes de saúde bucal devem investigar casos de traumatismos dentários diagnosticados na sua área de abrangência e identificar fatores sociais, ambientais, culturais e individuais que determinam sua ocorrência.\nII. As equipes de saúde bucal devem propor ações intersetoriais e de educação em saúde que visem assegurar medidas de proteção e prevenção de acidentes e comportamentos seguros.\nIII. Os profissionais de saúde bucal devem integrar-se ao restante da equipe de saúde na abordagem de fatores de risco comuns do traumatismo dentário e de outras lesões traumáticas.\nIV. O atendimento de urgência deve ocorrer na unidade básica, podendo-se encaminhar ao CEO ou hospital, de acordo com a gravidade e extensão do trauma e as condições físicas do usuário.\nÉ correto o que se afirma em", "alts": ["II, apenas.", "I e IV, apenas.", "III e IV, apenas.", "I, II e III, apenas.", "I, II, III e IV."], "gab": "D", "fig": false}, {"ano": 2016, "n": 30, "enun": "Um dos principais problemas enfrentados no cotidiano dos serviços de saúde bucal é a organização da demanda, em especial nas atividades assistenciais, o que deve ser amplamente discutido entre usuários e trabalhadores de saúde. O universo da atenção à saúde bucal compreende toda a população da área de abrangência, e as ações de atenção deverão ser desenvolvidas no espaço da Unidade Básica de Saúde e, também, nos diferentes espaços sociais existentes.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "A", "fig": false}, {"ano": 2016, "n": 31, "enun": "Considerando o manejo do comportamento infantil e as contribuições da Psicologia na clínica odontológica infantil, avalie as afirmações a seguir.\nI. Uma estratégia a ser utilizada pelo cirurgião-dentista, para crianças chorando intensamente, fazendo birra ou com acesso de raiva, é o reforço positivo, por meio de modulações de voz e expressão facial de acolhimento.\nII. A técnica do controle de voz baseia-se no tom e no volume da voz a serem empregados pelo cirurgião- dentista para obter a atenção da criança e, em seguida, sua cooperação; assim, com a entonação firme e decidida, ele pode estabelecer autoridade e, com entonação suave pode acalmar a criança.\nIII. A técnica dizer, mostrar e fazer, como o próprio nome diz tenta controlar a ansiedade da criança; o cirurgião-dentista verbaliza que vai colocar a mão na boca da criança, demonstra na sua própria boca e faz a contenção.\nIV. As técnicas não aversivas, como a dessensibilização em algumas sessões, são organizadas de modo que a complexidade dos procedimentos a serem executados aumentem progressivamente.\nV. O cirurgião-dentista deve se informar sobre eventos do cotidiano, como nascimento de irmão, falecimento de ente querido, horário de atendimento e de sono da criança, brigas e separação de pais, mudança de escola ou residência, os quais influenciam o comportamento da criança.\nÉ correto apenas o que se afirma em", "alts": ["I, II e III.", "I, II e V.", "I, III e IV.", "II, IV e V.", "III, IV e V. 2016 Disponível em: <http://www.ccine10.com.br>. Acesso em: 23 jun. 2016."], "gab": "D", "fig": false}, {"ano": 2016, "n": 32, "enun": "O envelhecimento populacional é um fenômeno mundial. No Brasil, nas três últimas décadas, o número de idosos aumentou nove vezes. Esta transição demográfica demanda mudanças na organização dos serviços, o que é um desafio para gestores e profissionais da saúde, pois requer maior preparo das equipes para o planejamento de medidas de prevenção, monitoramento e tratamento dos agravos em idosos, incluídos os agravos da saúde bucal.\nDisponível em: <http://www.cienciaesaudecoletiva.com.br>.\nAcesso em: 12 jul. 2016 (adaptado).\nConsiderando esse cenário de transição demográfica, avalie as asserções a seguir e a relação proposta entre elas.\nI. Em relação aos idosos, a interação do cirurgião-dentista com outros profissionais de saúde na Estratégia de Saúde da Família deve estar focada no tratamento periodontal e nas A respeito dessas asserções, assinale a opção correta. extrações dentárias.\nA As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.\nPORQUE\nB As asserções I e II são proposições verdadeiras,\nII. Os serviços de saúde direcionados aos mas a II não é uma justificativa correta da I. idosos requerem abordagens por meio de\nC A asserção I é uma proposição verdadeira, e a II é práticas interprofissionais e intersetoriais, uma proposição falsa. principalmente nas questões relacionadas às\nD A asserção I é uma proposição falsa, e a II é uma doenças cujos fatores de risco são comuns, proposição verdadeira. devendo estimular hábitos de vida saudáveis, E As asserções I e II são proposições falsas. cuidados diários com a higiene bucal e regularidade nos tratamentos odontológicos Área Livre da atenção primária.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "D", "fig": false}, {"ano": 2016, "n": 34, "enun": "Um cirurgião-dentista atua como gestor em um consultório odontológico, organizando o seu uso em forma de condomínio odontológico de acordo com o quadro abaixo em que o proprietário é o dono; o parceiro é o especialista ou clínico que usa o espaço e a estrutura e paga uma taxa fixa pelo horário de uso do consultório; free lancer é o especialista ou clínico mais experiente que complementa os serviços oferecidos ao paciente.\n2 ª feira\n3 ª feira\n4 ª feira\n5 ª feira\n6 ª feira\nSábado\n8 às 12h proprietário parceiro proprietário parceiro proprietário free lancer\nAlmoço\nIntervalo\nIntervalo\nIntervalo\nIntervalo\nIntervalo\n13 às 18h parceiro proprietário free lancer proprietário parceiro\nSILVA, C.H.V. et al. Liderança e empreendedorismo na prática odontológica. In: GOES, P. S. A. Gestão da prática em saúde bucal.\nSérie ABENO, São Paulo: Artes Médicas, p. 95-109, 2014 (adaptado).\nConsiderando a estratégia de gestão apresentada e suas implicações, avalie as afirmações a seguir.\nI. Os horários do consultório odontológico são aproveitados de forma eficiente, quando comparado a um consultório em que um profissional atua isoladamente.\nII. Os custos de gerenciamento para o parceiro aumentam proporcionalmente ao seu tempo de trabalho.\nIII. Os indicadores econômicos de desempenho do consultório apresentam piora porque há aumento dos custos de manutenção dos equipamentos.\nIV. Os lucros do proprietário crescem na medida em que aumenta a ocupação do consultório odontológico.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e IV.", "II e III.", "I, III e IV.", "II, III e IV. 2016"], "gab": "B", "fig": true}, {"ano": 2013, "n": 1, "enun": "Todo caminho da gente é resvaloso.\nMas também, cair não prejudica demais\nA gente levanta, a gente sobe, a gente volta!...\nO correr da vida embrulha tudo, a vida é assim:\nEsquenta e esfria, aperta e daí afrouxa,\nSossega e depois desinquieta.\nO que ela quer da gente é coragem.\nSer capaz de ficar alegre e mais alegre no meio da alegria,\nE ainda mais alegre no meio da tristeza...\nROSA, J.G. Grande Sertão: Veredas. Rio de Janeiro: Nova Fronteira, 2005.\nDe acordo com o fragmento do poema acima, de\nGuimarães Rosa, a vida é", "alts": ["uma queda que provoca tristeza e inquietute prolongada.", "um caminhar de percalços e dificuldades insuperáveis.", "um ir e vir de altos e baixos que requer alegria perene e coragem.", "um caminho incerto, obscuro e desanimador.", "uma prova de coragem alimentada pela tristeza. FORMAÇÃO GERAL"], "gab": "C", "fig": false}, {"ano": 2013, "n": 2, "enun": "A discussão nacional sobre a resolução das complexas questões sociais brasileiras e sobre o desenvolvimento em bases sustentáveis tem destacado a noção de corresponsabilidade e a de complementaridade entre as ações dos diversos setores e atores que atuam no campo social.\nA interação entre esses agentes propicia a troca de conhecimento das distintas experiências, proporciona mais racionalidade, qualidade e eficácia às ações desenvolvidas e evita superposições de recursos e competências.\nDe uma forma geral, esses desafios moldam hoje o quadro de atuação das organizações da sociedade civil do terceiro setor. No Brasil, o movimento relativo a mais exigências de desenvolvimento institucional dessas organizações, inclusive das fundações empresariais, é recente e foi intensificado a partir da década de 90.\nBNDES. Terceiro Setor e Desenvolvimento Social. Relato Setorial nº 3\nAS/GESET. Disponível em: <http://www.bndes.gov.br>.\nAcesso em: 02 ago. 2013 (adaptado).\nDe acordo com o texto, o terceiro setor", "alts": ["é responsável pelas ações governamentais na área social e ambiental.", "promove o desenvolvimento social e contribui para aumentar o capital social.", "gerencia o desenvolvimento da esfera estatal, com especial ênfase na responsabilidade social.", "controla as demandas governamentais por serviços, de modo a garantir a participação do setor privado.", "é responsável pelo desenvolvimento social das empresas e pela dinamização do mercado de trabalho."], "gab": "B", "fig": true}, {"ano": 2013, "n": 3, "enun": "Uma revista lançou a seguinte pergunta em um editorial: “Você pagaria um ladrão para invadir sua casa?”. As pessoas mais espertas diriam provavelmente que não, mas companhias inteligentes de tecnologia estão, cada vez mais, dizendo que sim. Empresas como a Google oferecem recompensas para hackers que consigam encontrar maneiras de entrar em seus softwares. Essas companhias frequentemente pagam milhares de dólares pela descoberta de apenas um bug\n– o suficiente para que a caça a bugs possa fornecer uma renda significativa. As empresas envolvidas dizem que os programas de recompensa tornam seus produtos mais seguros. “Nós recebemos mais relatos de bugs, o que significa que temos mais correções, o que significa uma melhor experiência para nossos usuários”, afirmou o gerente de programa de segurança de uma empresa.\nMas os programas não estão livres de controvérsias.\nAlgumas empresas acreditam que as recompensas devem apenas ser usadas para pegar cibercriminosos, não para encorajar as pessoas a encontrar as falhas.\nE também há a questão de double-dipping – a possibilidade de um hacker receber um prêmio por ter achado a vulnerabilidade e, então, vender a informação sobre o mesmo bug para compradores maliciosos.\nDisponível em: <http://pcworld.uol.com.br>.\nAcesso em: 30 jul. 2013 (adaptado).\nConsiderando o texto acima, infere-se que", "alts": ["os caçadores de falhas testam os softwares, checam os sistemas e previnem os erros antes que eles aconteçam e, depois, revelam as falhas a compradores criminosos.", "os caçadores de falhas agem de acordo com princípios éticos consagrados no mundo empresarial, decorrentes do estímulo à livre concorrência comercial.", "a maneira como as empresas de tecnologia lidam com a prevenção contra ataques dos cibercriminosos é uma estratégia muito bem-sucedida.", "o uso das tecnologias digitais de informação e das respectivas ferramentas dinamiza os processos de comunicação entre os usuários de serviços das empresas de tecnologia.", "os usuários de serviços de empresas de tecnologia são beneficiários diretos dos trabalhos desenvolvidos pelos caçadores de falhas contratados e premiados pelas empresas."], "gab": "E", "fig": false}, {"ano": 2013, "n": 4, "enun": "A Política Nacional de Resíduos Sólidos (Lei n° 12.305, de 2 de agosto de 2010) define a logística reversa como o “instrumento caracterizado por um conjunto de ações, procedimentos e meios destinados a viabilizar a coleta e a restituição dos resíduos sólidos ao setor empresarial, para reaproveitamento, em seu ciclo ou em outros ciclos produtivos, ou outra destinação final ambientalmente adequada”.\nA Lei n° 12.305/2010 obriga fabricantes, importadores, distribuidores e comerciantes de agrotóxicos, pilhas, baterias, pneus, óleos lubrificantes, lâmpadas fluorescentes, produtos eletroeletrônicos, embalagens e componentes a estruturar e implementar sistemas de logística reversa, mediante retorno dos produtos após o uso pelo consumidor, de forma independente do serviço público de limpeza urbana e de manejo dos resíduos sólidos.\nConsiderando as informações acima, avalie as asserções a seguir e a relação proposta entre elas.\nI. O retorno de embalagens e produtos pós- consumo a seus fabricantes e importadores objetiva responsabilizar e envolver, na gestão ambiental, aquele que projeta, fabrica ou comercializa determinado produto e lucra com ele.\nPORQUE\nII. Fabricantes e importadores responsabilizados, inclusive financeiramente, pelo gerenciamento no pós-consumo são estimulados a projetar, manufaturar e comercializar produtos e embalagens menos poluentes e danosos ao meio ambiente.\nFabricantes são os que melhor conhecem o processo de manufatura, sendo, por isso, os mais indicados para gerenciar o reprocessamento e reaproveitamento de produtos e embalagens.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "A", "fig": false}, {"ano": 2013, "n": 6, "enun": "De um ponto de vista econômico, a globalização é a forma como os mercados de diferentes países interagem e aproximam pessoas e mercadorias.\nA superação de fronteiras gerou uma expansão capitalista que tornou possível realizar transações financeiras e expandir os negócios para mercados distantes e emergentes. O complexo fenômeno da globalização resulta da consolidação do capitalismo, dos grandes avanços tecnológicos e da necessidade de expansão do fluxo comercial mundial. As inovações nas áreas das telecomunicações e da informática (especialmente com a Internet) foram determinantes para a construção de um mundo globalizado.\nDisponível em: <www.significados.com.br>.\nAcesso em: 2 jul. 2013 (adaptado).\nSobre globalização, avalie as afirmações a seguir.\nI. É um fenômeno gerado pelo capitalismo, que impede a formação de mercados dinâmicos nos países emergentes.\nII. É um conjunto de transformações na ordem política e econômica mundial que aprofunda a integração econômica, social, cultural e política.\nIII. Atinge as relações e condições de trabalho decorrentes da mobilidade física das empresas.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "gab": "D", "fig": false}, {"ano": 2013, "n": 7, "enun": "Uma sociedade sustentável é aquela em que o desenvolvimento está integrado à natureza, com respeito à diversidade biológica e sociocultural, exercício responsável e consequente da cidadania, com a distribuição equitativa das riquezas e em condições dignas de desenvolvimento.\nEm linhas gerais, o projeto de uma sociedade sustentável aponta para uma justiça com equidade, distribuição das riquezas, eliminando-se as desigualdades sociais; para o fim da exploração dos seres humanos; para a eliminação das discriminações de gênero, raça, geração ou de qualquer outra; para garantir a todos e a todas os direitos à vida e à felicidade, à saúde, à educação, à moradia, à cultura, ao emprego e a envelhecer com dignidade; para o fim da exclusão social; para a democracia plena.\nTAVARES, E. M. F. Disponível em: <http://www2.ifrn.edu.br>.\nAcesso em: 25 jul. 2013 (adaptado).\nNesse contexto, avalie as asserções a seguir e a relação proposta entre elas.\nI. Os princípios que fundamentam uma sociedade sustentável exigem a adoção de políticas públicas que entram em choque com velhos pressupostos capitalistas.\nPORQUE\nII. O crescimento econômico e a industrialização, na visão tradicional, são entendidos como sinônimos de desenvolvimento, desconsiderando-se o caráter finito dos recursos naturais e privilegiando-se a exploração da força de trabalho na acumulação de capital.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "A", "fig": false}, {"ano": 2013, "n": 9, "enun": "Um paciente de 38 anos de idade procurou atendimento odontológico para tratamento protético do dente 12. Finalizada a anamnese e o exame físico, foi constatada ausência de sintomatologia nesse dente e observou-se hiperplasia gengival na região palatina.\nO paciente relatou que, há mais de três meses, caiu a restauração provisória retida a pino. No exame radiográfico, observou-se tratamento endodôntico com obturação no limite apical adequado em remanescente dentário de 21,0 mm de comprimento.\nPara o caso apresentado acima, qual o plano de tratamento mais adequado?", "alts": ["Gengivectomia, confecção de pino com preparo intrarradicular de 14 mm e coroa protética.", "Gengivectomia, descontaminação do espaço radicular protético, confecção de pino com preparo intrarradicular de 16 mm e coroa protética.", "Descontaminação do espaço radicular protético, gengivectomia, confecção de pino com preparo intrarradicular de 14 mm e coroa protética.", "Retratamento endodôntico, gengivectomia, confecção de pino com preparo intrarradicular de 16 mm e coroa protética.", "Gengivectomia, retratamento endodôntico, confecção de pino com preparo intrarradicular de 14 mm e coroa protética. COMPONENTE ESPECÍFICO"], "gab": "E", "fig": true}, {"ano": 2013, "n": 10, "enun": "Uma menina de 8 anos de idade sofreu um acidente de bicicleta na calçada em frente a sua casa, ocorrendo a avulsão do dente 11. A vizinha que presenciou o acidente pegou o dente pela coroa, lavou rapidamente em água corrente filtrada e reimplantou o dente. Após três horas do reimplante, a família da criança levou-a a um consultório odontológico para uma avaliação.\nNesse contexto, avalie as seguintes asserções e a relação proposta entre elas.\nI. O sucesso de um dente reimplantado depende do período de tempo em que ele permaneceu fora do alvéolo até a sua recolocação.\nPORQUE\nII. O desenvolvimento radicular incompleto na ocasião da avulsão proporciona maior chance de recuperação da vitalidade pulpar após o reimplante.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "B", "fig": false}, {"ano": 2013, "n": 11, "enun": "Segundo o estudo epidemiológico SB Brasil 2010, mais de 3 milhões de idosos entre 65 e 74 anos de idade necessitam de prótese total nas duas arcadas dentárias, e 4 milhões de idosos precisam usar prótese total em uma das arcadas. O gráfico mostra a necessidade de prótese total em idosos, no período de 2003 a 2010. Os laboratórios regionais de prótese produzem anualmente cerca de 480 mil próteses.\nCom relação à organização de serviços de saúde bucal, avalie as afirmativas a seguir.\nI. A precariedade das condições de saúde bucal dos idosos requer políticas de saúde que garantam informações sobre saúde bucal, acesso a serviços preventivos e curativos, bem como reabilitadores.\nII. Apesar do panorama de demandas odontológicas de idosos acumuladas, o tratamento restaurador destinado a crianças deve ser prioritário, tendo em vista a necessidade de reduzir o índice CPOD em escolares.\nIII. O aumento de recursos destinados à atenção terciária, com maior investimento em laboratórios de prótese dentária, visa atender às necessidades acumuladas de reabilitação oral.\nIV. É necessário reverter um modelo assistencial centrado em práticas curativas e mutiladoras, o que resultou em quadro de elevado edentulismo em idosos brasileiros.\nV. O menor uso de serviços odontológicos entre os idosos que necessitavam de prótese em uma arcada dentária resulta da necessidade de próteses inferiores, pouco aceitas pelos pacientes idosos devido às dificuldades de adaptação.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e IV.", "II e III.", "III e V.", "IV e V. Necessidade de prótese total entre idosos. Brasil. 2003-2010. BRASIL. Ministério da Saúde. Projeto SB Brasil 2010: Pesquisa Nacional de Saúde Bucal. Brasília, 2011."], "gab": "B", "fig": true}, {"ano": 2013, "n": 12, "enun": "Um paciente do sexo masculino, com 40 anos de idade, tabagista, que relata o consumo de 20 cigarros por dia há mais de 10 anos, apresenta lesão branca, como a ilustrada na figura. No exame e na abordagem clínica, verifica-se que essa lesão não pode ser removida facilmente por raspagem.\nBORAKS, S. Diagnóstico Bucal. 2 ed. São Paulo: Artes Médicas, 1999.\nDe acordo com o relato e a figura apresentados, assinale a opção que apresenta, respectivamente, o diagnóstico provável da lesão, o exame complementar e a melhor conduta para o seu tratamento.", "alts": ["Leucoplasia; biópsia incisional; remoção cirúrgica.", "Líquen plano; citologia esfoliativa; remoção cirúrgica.", "Candidíase; citologia esfoliativa; aplicação tópica de corticoide.", "Hiperqueratose; biópsia excisional; aplicação tópica de corticoide.", "Nevo branco esponjoso; biópsia incisional; remoção do agente causador."], "gab": "A", "fig": true}, {"ano": 2013, "n": 13, "enun": "Durante a realização de exodontia com seccionamento do dente 27 de paciente do sexo masculino, com 22 anos de idade, uma técnica em saúde bucal (TSB) utilizava o sugador, quando percebeu a ruptura da luva cirúrgica em sua mão esquerda. A TSB é destra e, no momento em que notou o rompimento da luva, comunicou o fato ao cirurgião-dentista (CD). O CD solicitou que a TSB continuasse o atendimento ao paciente, que estava anestesiado e não deveria ter o procedimento cirúrgico interrompido.\nDiante dessa situação, a TSB deve", "alts": ["perguntar ao paciente se ele tem alguma doença infectocontagiosa e, em caso de resposta negativa, atender à solicitação do CD.", "deixar sua função e proceder à lavagem cirúrgica das mãos, para remoção da flora residente, em que predominam os estafilococos, desconsiderando, assim, a solicitação do CD.", "proceder à antissepsia das mãos, pois as bactérias Gram+ presentes na flora transitória são as principais responsáveis pelas infecções hospitalares, desconsiderando, assim, a solicitação do CD.", "continuar o atendimento ao paciente e efetuar exames sorológicos para detecção de hepatite B e Aids, de forma a atender à solicitação do CD.", "proceder à troca das luvas na lavagem das mãos, evitando que a flora residente oriunda de suas mãos torne-se patogênica, por se tratar de procedimento cirúrgico, e justificar sua atitude ao CD."], "gab": "E", "fig": false}, {"ano": 2013, "n": 14, "enun": "Ao planejar as ações em uma população adscrita de uma Unidade Básica de Saúde na área rural, o cirurgião-dentista incorporou a medição de íon flúor nas águas dos poços artesianos que as famílias usam para o consumo humano, visando realizar mapeamento das áreas com teores residuais de flúor. Considerando o uso do flúor em área rural e a\nEstratégia de Saúde da Família, avalie as afirmativas a seguir.\nI. A presença de flúor em teores acima do recomendado nas águas dos poços artesianos que abastecem a população na área rural constitui um dos fatores de risco à fluorose dentária na população.\nII. O baixo teor de flúor residual na água de poços artesianos de consumo humano na área rural dispensa a realização dos levantamentos epidemiológicos de fluorose dentária pela\nEstratégia de Saúde da Família.\nIII. A realização de levantamento epidemiológico de cárie e fluorose dentária e a determinação da concentração de flúor nas águas dos poços artesianos contribuem para o planejamento das ações coletivas de saúde.\nIV. A vigilância, o controle e a orientação à população quanto às várias formas de utilização do flúor são medidas necessárias para o controle das formas agudas e crônicas de intoxicação por flúor e constituem ações de abordagem individual na prevenção da fluorose dentária.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "B", "fig": false}, {"ano": 2013, "n": 15, "enun": "Durante procedimento de exodontia a retalho, em que o anestésico utilizado foi a prilocaína associada à epinefrina, na concentração de 1:100 000, um paciente do sexo masculino, com 57 anos de idade e histórico de hipertensão prévia controlada por\nß-bloqueador relatou sentir-se mal. O profissional interrompeu o procedimento, procurou acalmar o paciente e o colocou deitado. A aferição, por três vezes consecutivas da pressão arterial, resultou em pressão diastólica superior a 120 mmHg.\nPara caracterizar o quadro clínico como urgência hipertensiva, o paciente precisaria apresentar", "alts": ["cefaleia, tontura e alterações visuais.", "hálito cetônico e alterações visuais.", "náusea, tontura e sudorese.", "palpitações e perda gradual de consciência.", "sensação de desmaio, palidez e taquicardia."], "gab": "A", "fig": true}, {"ano": 2013, "n": 16, "enun": "Um paciente do sexo masculino de 19 anos de idade chega ao consultório odontológico relatando dor provocada no dente 16. Clinicamente, observou-se a presença de lesão cariosa já cavitada, envolvendo as faces oclusal e mesial desse dente (figura 1). Radiograficamente, observou-se a presença de cárie profunda, com proximidade do corno pulpar mesial, integridade no espaço periodontal e ausência de lesões na região periapical. O aspecto clínico, após a abertura coronária e remoção do tecido cariado pode ser observado na figura 2. O paciente apresentava os demais dentes em bom estado de conservação, com poucas restaurações, e bom padrão de higiene bucal.\nCom relação aos materiais restauradores e suas características, avalie as afirmativas a seguir.\nI. Os preparos classe II, com envolvimento da crista marginal, devem ser restaurados com resina composta e ionômero de vidro.\nII. As resinas compostas, que apresentam a vantagem de ter contração de polimerização semelhante à da dentina e esmalte, evitam infiltração marginal e aumentam o tempo de vida das restaurações.\nIII. O uso do amálgama em cavidades amplas com pouca estrutura dental remanescente apresenta maior risco de fratura dental, quando comparado ao uso de materiais restauradores adesivos.\nIV. O amálgama apresenta maior facilidade de estabelecer e manter adequado ponto de contato, por ter resistência ao desgaste próximo da estrutura dentária.\nV. Quanto mais para distal no arco e maior a extensão da restauração, pior é o prognóstico das restaurações de resina composta, devido ao maior número de contatos cêntricos e estresse mecânico.\nÉ correto apenas o que se afirma em", "alts": ["I, II e III.", "I, II e V.", "I, III e IV.", "II, IV e V.", "III, IV e V."], "gab": "E", "fig": true}, {"ano": 2013, "n": 17, "enun": "No tratamento endodôntico de um canal curvo, o cirurgião-dentista observou, no final da instrumentação com limas manuais em aço inoxidável, que os cursores do instrumento não tocavam o bordo de referência. Ao radiografar, verificou a situação ilustrada na figura abaixo.\nEm relação à situação acima, avalie as afirmações a seguir.\nI. A prevenção da situação ilustrada na figura é pré-curvar os instrumentos, irrigar abundantemente e aspirar.\nII. A prevenção da situação mostrada na figura é proceder à correta odontometria, além de calibrar os instrumentos de maneira estável.\nIII. Para desobstruir o terço apical é indicado utilizar solução de EDTA, agitando-o a cada colocação. Com esse procedimento, dissolve- se o material impactado, bem como facilita-se a recuperação do trajeto do canal.\nIV. Não é indicado desobstruir o terço apical irrigando com EDTA, devido ao risco de se perfurar o canal.\nÉ correto apenas o que se afirma em", "alts": ["II.", "III.", "I e III.", "I e IV.", "II e IV."], "gab": null, "fig": true}, {"ano": 2013, "n": 18, "enun": "Um adolescente de 15 anos de idade apresentou- se no consultório odontológico com dor aguda, contínua e edema na região do primeiro molar inferior esquerdo. Durante a anamnese, o paciente relatou ser usuário de crack há mais de 12 meses. Ao exame clínico e radiográfico, verificou-se que o dente apresentava grande destruição e comprometimento de furca, sendo indicada sua exodontia.\nConsiderando essa situação, avalie as afirmações a seguir.\nI. A solução anestésica que contém vasoconstritor semelhante à epinefrina está indicada para a realização da exodontia porque, com essa droga, não há risco de elevação da pressão arterial e do ritmo cardíaco do paciente.\nII. A solução anestésica lidocaína 2% com epinefrina pode ser utilizada, por propiciar menor toxicidade sistêmica e minimizar o risco de elevação da pressão arterial e do ritmo cardíaco do paciente.\nIII. A solução anestésica prilocaína 3% com felipressina 0,03 UI é uma alternativa para o atendimento odontológico porque, com essa droga, não há risco de elevação severa da pressão arterial e do ritmo cardíaco do paciente.\nIV. As soluções anestésicas que contêm vasoconstritores semelhantes à epinefrina devem ser evitadas, porque o uso crônico do crack faz com que haja liberação de dopamina, com aumento de adrenalina no organismo e consequente aumento da pressão arterial e do ritmo cardíaco do paciente.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "III e IV.", "I, II e IV.", "II, III e IV."], "gab": "C", "fig": true}, {"ano": 2013, "n": 19, "enun": "Um cirurgião-dentista vinculado ao programa odontológico de uma escola da rede pública, ao realizar o atendimento de rotina em uma criança, que já era sua paciente há algum tempo, percebeu alterações de comportamento e alguns hematomas nos braços e ao redor dos olhos. Questionada sobre a causa dos hematomas, a criança manifestou contradições inúmeras vezes. Em conversa com os professores, foi constatada queda no rendimento escolar e tendência ao isolamento dos colegas.\nDiante do caso relatado, que atitude o cirurgião- dentista deve assumir, de modo a respeitar o Estatuto da Criança e do Adolescente?", "alts": ["Denunciar a suspeita de maus-tratos ao Conselho Tutelar ou à autoridade competente da localidade mais próxima.", "Continuar a realizar o atendimento, seguindo a rotina, uma vez que crianças são emocionalmente instáveis.", "Investigar a causa dos hematomas e chamar os pais e(ou) responsáveis, para prestarem esclarecimentos.", "Comunicar à direção da escola a suspeita de que a criança seja vítima de violência domiciliar, porque a escola é responsável pela investigação do caso.", "Investigar o caso com cautela e denunciar ao Conselho Tutelar se houver certeza de que a criança é vítima de maus tratos."], "gab": "A", "fig": false}, {"ano": 2013, "n": 20, "enun": "Um paciente do gênero feminino, 37 anos de idade, leucoderma e bruxonoma, procurou atendimento e relatou queixa de dor provocada na região do elemento 46, com início havia duas semanas. Ao exame intrabucal, observou-se uma restauração oclusodistal em resina composta.\nConsiderando a elaboração do diagnóstico desse caso, avalie as afirmativas a seguir.\nI. Na ausência de dor à palpação e à percussão, dor desencadeada por estímulo frio, presença de uma linha radiolúcida na interface dente/ restauração e aspecto de normalidade do ligamento periodontal no exame radiográfico do 46, o diagnóstico é de pulpite reversível.\nII. Na ausência de dor à palpação, dor desencadeada à percussão e exacerbada após aplicação de calor, presença de linha radiolúcida na interface dente/restauração e aspecto de normalidade do ligamento periodontal no exame radiográfico do 46, o diagnóstico é de abcesso periapical.\nIII. Diante de uma resposta positiva ao teste de sensibilidade pulpar, aumento volumétrico com tecido avermelhado, mobilidade, sensação de dente extruído, profundidade de sondagem do sulco gengival de 7 mm e perda óssea vertical no exame radiográfico do 46, o diagnóstico é de abscesso peridontal.\nIV. Na presença de dor à palpação e atividade funcional dos músculos elevadores da mandíbula, ausência de cárie e(ou) uma linha radiolúcida na interface dente/restauração e aspecto de normalidade do ligamento periodontal no exame radiográfico dos dentes\n45-48, o diagnóstico é de dor miofascial referida para a região dos dentes posteriores da mandíbula.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "II e III.", "III e IV.", "I, II e IV.", "I, III e IV."], "gab": "E", "fig": true}, {"ano": 2013, "n": 21, "enun": "Uma paciente com 17 anos de idade procura a clínica odontológica desejando clarear seus dentes, pois ela julga que seu sorriso é “meio amarelado”.\nAo exame clínico, o cirurgião-dentista verifica que há muitos dentes com restaurações, tanto anteriores como posteriores. Não há história de tratamento endodôntico.\nEm relação à conduta clínica e ao respeito aos princípios éticos, o cirurgião dentista deveria\nI. alertar que podem ocorrer mudanças nas restaurações durante o clareamento, podendo ser necessário o polimento ou a substituição das restaurações.\nII. informar que o efeito do clareamento ocorre sobre os dentes e não afeta as propriedades físicas e químicas das restaurações.\nIII. garantir o grau de clareamento, desde que a concentração seja controlada e a aplicação do agente clareador seja repetida quantas vezes forem necessárias até se obter o grau de clareamento desejado.\nIV. orientar que os produtos resultantes da reação dos agentes clareadores podem agredir a polpa dental através dos túbulos dentinários.\nÉ correto apenas o que se afirma em", "alts": ["I.", "III.", "I e IV.", "II e III.", "II e IV."], "gab": "C", "fig": false}, {"ano": 2013, "n": 22, "enun": "Um paciente do sexo masculino de 22 anos de idade procurou atendimento em uma clínica odontológica, por apresentar dente superior com sensibilidade a variações térmicas. Após exame clínico, foi verificada, no dente 25, uma lesão cariosa com cavidade (MOD) e inflamação gengival. O exame radiográfico periapical evidenciou extensa área radiolúcida coronária, sugestiva de lesão de cárie próxima à câmara pulpar e limite cervical da cavidade distal a 1,0 mm da crista óssea alveolar.\nNa situação descrita, que procedimentos clínicos definitivos devem ser executados, a fim de se reestabelecerem as funções do dente?", "alts": ["Raspagem subgengival, capeamento pulpar direto com hidróxido de cálcio PA e restauração.", "Proteção do complexo dentina-polpa com cimento de hidróxido de cálcio, restauração e raspagem subgengival.", "Capeamento pulpar indireto com hidróxido de cálcio PA, restauração e cunha interproximal com osteotomia.", "Cunha interproximal sem osteotomia, capeamento pulpar indireto com cimento de hidróxido de cálcio e restauração.", "Cunha interproximal com osteotomia, proteção do complexo dentina-polpa com cimento de hidróxido de cálcio e restauração."], "gab": "E", "fig": true}, {"ano": 2013, "n": 23, "enun": "A preservação dos tecidos bucais, a estabilidade, a retenção, o suporte e a estética são objetivos fundamentais a serem alcançados durante o ato de moldar o paciente desdentado total. Além disso, as moldagens devem proporcionar a confecção de bases de próteses totais que respeitem os limites de tolerância fisiológica dos tecidos de suporte.\nREIS et al. Moldagem em prótese total: uma revisão de literatura.\nRFO, v. 12, n. 1, p. 70-74, jan./abr. 2007.\nConsiderando o texto acima, avalie as asserções a seguir e a relação proposta entre elas.\nI. Durante a moldagem funcional, a pressão exercida nos tecidos pode ser controlada pela presença de alívio e(ou) perfurações nas moldeiras, bem como pela viscosidade, fluidez e escoamento do material de moldagem.\nPORQUE\nII. Para moldagem de borda em prótese total, são indicados os materiais de consistência leve ou regular, para que seja possível essa área ser moldada com alguma pressão; para a área de suporte, devem ser utilizados materiais de consistência pesada, a fim de que essa região seja moldada de forma compressiva.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "C", "fig": false}, {"ano": 2013, "n": 24, "enun": "Grande quantidade de lixo está acumulada nos fundos de um hospital. Sacos plásticos de cor branca leitosa, padronizados, com o símbolo de risco biológico foram fotografados. Procurado pela reportagem, o gestor de resíduos de saúde da instituição confirmou que o lixo estava acumulado na parte dos fundos do hospital, mas disse que não era material contaminado, porque o descarte seguia normas estabelecidas pela Agência Nacional de\nVigilância Sanitária (Anvisa). “Há alguns dias, parte do material coletado pela empresa voltou do aterro sanitário por ordem da Superintendência Municipal de Limpeza Urbana, que entendeu que havia a mistura de lixo comum com o hospitalar”, informou o responsável.\nDisponível em: <http://g1.globo.com>. Acesso em: 30 jun. 2013 (adaptado).\nA situação descrita na reportagem demonstra irregularidades no manejo dos resíduos gerados no serviço de saúde (RSS). Por tratar-se de resíduos com potencial de causar danos à saúde e ao meio ambiente, qual é a recomendação básica, regulamentada pelos órgãos competentes, para o manejo desses resíduos?", "alts": ["As autoridades municipais são legalmente responsáveis pelo gerenciamento dos RSS, desde que estes estejam devidamente acondicionados.", "Os resíduos biológicos devem ser acondicionados em recipiente metálico, com tampa vedável, rotulados com o símbolo de risco biológico, para que a saúde pública e o meio ambiente sejam preservados.", "Os RSS são descartados nos aterros sanitários juntamente com o lixo comum, porém devidamente acondicionados e rotulados, para que a saúde pública e o meio ambiente sejam preservados.", "O gerador dos resíduos é responsável pela segregação e acondicionamento dos RSS gerados por ele, até à destinação final.", "A Anvisa é o órgão responsável pela elaboração do Plano de Gerenciamento de Resíduos de Serviços de Saúde (PGRSS) dos serviços geradores de RSS."], "gab": "D", "fig": false}, {"ano": 2013, "n": 26, "enun": "Um cirurgião-dentista assumiu a coordenação de saúde bucal de seu município. Na primeira reunião com a sua equipe, propôs a realização de uma oficina para a elaboração do seu plano de gestão, com duração de quatro anos. Foi solicitado aos participantes da oficina que se orientassem pelas\nDiretrizes da Política Nacional de Saúde Bucal (2004).\nConsiderando essa situação e as ações e estratégias prioritárias que devem orientar a atenção em saúde bucal em todos os níveis, avalie as afirmações a seguir.\nI. Para melhor identificar os principais grupos a serem priorizados e as ações que irão compor as linhas de cuidado, é necessário conhecer as características do perfil epidemiológico da população, as doenças e agravos de maior prevalência, bem como a forma com que as pessoas vivem e como os serviços de saúde são ofertados.\nII. As ações de promoção e proteção da saúde, que devem ser desenvolvidas como procedimentos coletivos em parcerias intersetoriais, visam reduzir fatores de risco e compreendem elenco bastante vasto e diversificado de atividades de natureza eminentemente educativo-preventiva.\nIII. Ampliar no município as redes públicas de tratamento de águas, de forma a garantir o acesso à água tratada e fluoretada, é a forma mais abrangente e socialmente justa de acesso ao flúor.\nIV. As ações de recuperação devem ser centradas na detecção do câncer bucal, por meio de biópsias realizadas dentro da rede de saúde.\nV. As ações de saúde bucal devem ser inseridas de forma transversal nos diferentes programas integrais de saúde, por linhas de cuidado ou por condição de vida.\nÉ correto apenas o que se afirma em", "alts": ["I, II e IV.", "I, II e V.", "I, III e V.", "II, III e IV.", "III, IV e V."], "gab": "C", "fig": false}, {"ano": 2013, "n": 27, "enun": "Um cirurgião-dentista sofreu um acidente no consultório com uma agulha contaminada, a qual perfurou sua luva e pele. O ferimento ocorreu durante o atendimento de um paciente que relatou ser portador de hepatite B. Nessa situação, o cirurgião-dentista", "alts": ["deve ser medicado com imunoglobulina humana anti-hepatite B logo após o acidente.", "deve realizar o exame de carga viral do HBV e o teste de biologia molecular logo após o acidente.", "está imunizado, caso tenha recebido três doses de vacina contra hepatite B (0, 30 e 90 dias).", "está imunizado, caso apresente anti-HBs não reagente (≥ 10 UI/mL).", "deve realizar o teste anti-HBs sete dias após o acidente."], "gab": "A", "fig": false}, {"ano": 2013, "n": 28, "enun": "De acordo com os resultados encontrados no\nProjeto SB Brasil 2010: Pesquisa Nacional de Saúde\nBucal, a prevalência de pelo menos um dente incisivo afetado por traumatismo em crianças de 12 anos é de 20,5%.\nBRASIL. Ministério da Saúde. SB Brasil 2010: Pesquisa Nacional de Saúde\nBucal. Brasília, 2011. Disponível em: <http://bvsms.saude.gov.br/ >.\nAcesso em: 20 jul. 2013.\nUm cirurgião-dentista que atua em uma Unidade\nBásica de Saúde constata, na sua área de abrangência, prevalência de 32% de incisivos permanentes afetados por trauma em crianças de 12 anos. Nesse caso, para reduzir esse índice, o profissional da\nEstratégia de Saúde da Família deverá\nI. elaborar um protocolo de atendimento, estabelecendo a metodologia a ser utilizada para a definição dos tipos de traumatismos, as técnicas de tratamento e de monitoramento das eventuais sequelas.\nII. propor ações de promoção da saúde, com ações intersetoriais e de educação em saúde que visem assegurar medidas de proteção, prevenção de acidentes e comportamentos seguros.\nIII. integrar os profissionais de saúde bucal com o restante da equipe de saúde na abordagem de fatores de risco comuns do traumatismo dentário e de outras lesões traumáticas.\nIV. manter uma equipe de atendimento de urgência na Unidade Básica e estabelecer a possibilidade de encaminhamento de paciente ao centro de especialidades odontológicas ou hospital, de acordo com a gravidade e a extensão do trauma e as condições físicas do paciente.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e IV.", "II e III.", "I, III e IV.", "II, III e IV."], "gab": "C", "fig": false}, {"ano": 2013, "n": 29, "enun": "A Portaria Federal nº 453, de 1º de junho de 1998, estabelece, por meio do Regulamento Técnico, as diretrizes básicas de proteção radiológica em radiodiagnóstico médico e odontológico e dispõe sobre o uso dos raios-X diagnósticos em todo território nacional. O cirurgião-dentista que possuir, em seu consultório, equipamento radiológico intraoral deverá adequar as instalações para atender ao disposto nessa Portaria.\nConsiderando as obrigações relativas ao uso do equipamento radiológico intraoral em consultório odontológico, avalie as afirmativas a seguir.\nI. O equipamento de radiografia intraoral deve ser instalado em ambiente (consultório ou sala) com dimensões suficientes para permitir à equipe manter-se à distância mínima de 2 m do cabeçote e do paciente.\nII. As mulheres grávidas que trabalham em consultório odontológico com equipamento de radiografia intraoral devem comunicar a gravidez ao chefe, para lhes ser concedido o afastamento do ambiente de trabalho até o término da gestação.\nIII. No consultório odontológico, deve haver, para cada equipamento de raios-X, uma vestimenta plumbífera que garanta a proteção do tronco dos pacientes, incluídas tireoide e gônadas, e que tenha, pelo menos, o equivalente a 0,25 mm de chumbo.\nIV. No consultório odontológico com equipamento de radiografia intraoral deve haver sinalização luminosa vermelha acima da face externa da porta de acesso à sala de raios-X, acompanhada do seguinte aviso de advertência: “Quando a luz vermelha estiver acesa, a entrada é proibida.”\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "B", "fig": false}, {"ano": 2013, "n": 30, "enun": "A imagem acima apresenta as condições bucais de uma criança do sexo masculino com 24 meses de idade, de cor parda, que compareceu à Unidade Básica de Saúde, acompanhada de sua mãe, para atendimento odontológico. A mãe é do lar e a renda do pai é de um salário mínimo. Os pais têm nível de escolaridade de ensino fundamental incompleto. Na anamnese, a mãe relatou que a saúde geral de seu filho era boa. Quanto à dieta, informou que o paciente consumia leite materno em regime de livre demanda, além da ingestão frequente de carboidratos e sacarose. Nas refeições principais, a mãe relatou ter o hábito de experimentar a comida da criança. A escovação era realizada pela mãe, duas vezes ao dia. A criança possui hábito de sucção do polegar.\nConsiderando a situação bucal da criança e os fatores do processo saúde-doença, avalie as afirmações abaixo.\nI. A livre demanda do leite materno, aliada à ingestão frequente de carboidratos e sacarose, é fator determinante da cárie de estabelecimento precoce.\nII. A renda familiar, a atitude materna quanto à alimentação e à higiene bucal da criança constituem fatores moduladores da doença cárie.\nIII. O hábito da mãe de experimentar a comida de seu filho e o hábito da criança de sucção do polegar são fatores que contribuem para a transmissibilidade por estreptococos do grupo mutans.\nIV. O nível de escolaridade materna está diretamente associado ao desenvolvimento do processo da cárie de estabelecimento precoce.\nV. Na escovação dentária em criança com médio ou alto risco de cárie nessa faixa etária, deve ser seguida a recomendação de uso de creme dental não fluoretado, para se evitar o risco de fluorose.\nÉ correto apenas o que se afirma em", "alts": ["I, II e III.", "I, II e V.", "I, IV e V.", "II, III e IV.", "III, IV e V. Disponível em: <http://paediatricdentist.ie>. Acesso em: 20 jul. 2013."], "gab": null, "fig": true}, {"ano": 2013, "n": 32, "enun": "Uma paciente com 40 anos de idade e portadora de diabetes mellitus frequenta o grupo de diabéticos na Unidade Básica de Saúde, perto de sua residência.\nA enfermeira da Equipe de Saúde da Família (ESF) observa que a paciente apresenta dificuldade no controle da glicemia e a encaminha para avaliação médica, que confirma o quadro. Buscando evolução do tratamento, o médico reitera o controle de dieta, uso diário de insulina, desenvolvimento de atividades físicas e solicita avaliação odontológica, pois observou halitose e gengiva sangrante na paciente. O diagnóstico bucal do cirurgião-dentista da ESF foi de doença periodontal avançada.\nConsiderando o afirmações a seguir. caso relatado, avalie as\nI. O tratamento odontológico deve ser realizado sob antibioticoterapia profilática e anestesia local com adrenalina, droga de escolha para a hemostasia.\nII. A paciente deve ser instruída a fazer sua dosagem de insulina e a se alimentar normalmente antes do atendimento.\nIII. A paciente deve ser agendada pela manhã, quando sua glicose está baixa e a atividade insulínica é alta.\nIV. O controle da doença periodontal avançada da paciente irá contribuir no controle sistêmico da diabetes mellitus.\nV. O quadro de diabetes mellitus da paciente mantém estáveis os níveis de crescimento, proliferação e síntese da matriz pelos fibroblastos do ligamento periodontal e gengiva.\nÉ correto apenas o que se afirma em", "alts": ["II e III.", "I, II e IV.", "I, II e V.", "III, IV e V.", "I, III, IV e V."], "gab": "C", "fig": true}, {"ano": 2013, "n": 34, "enun": "Um paciente de 17 anos de idade procurou uma clínica odontológica para trocar o amálgama das restaurações por resina composta, desejando melhorar a estética. Após a troca da restauração, na sessão seguinte, o paciente relatou sensibilidade dentária, e o cirurgião-dentista receitou anti- inflamatório. Passadas quatro semanas, a sensibilidade continuou.\nAvalie, entre os procedimentos a seguir, aqueles que, na situação descrita, podem ter causado a sensibilidade dentária.\nI. Remoção do amálgama com broca em alta rotação com refrigeração.\nII. Ausência de proteção com hidróxido de cálcio na dentina próxima da polpa.\nIII. Fotopolimerização da resina composta em tempo maior que 40 segundos.\nIV. Fotopolimerização da resina composta em pequenos incrementos.\nV. Fotopolimerização com aparelho de comprimento de onda luminosa de 250 nanômetros.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e IV.", "II e V.", "III e IV.", "III e V."], "gab": "C", "fig": false}, {"ano": 2007, "n": 11, "enun": "WOLF, H.F. et al. Peridontia.\nSão Paulo: Artmed, 2006.\nAs técnicas biomoleculares contribuíram para o desenvolvi- mento de exames laboratoriais capazes de detectar os mi- crorganismos no sulco gengival, fornecendo diagnósticos mais precisos e identificando indivíduos de risco. A sonda de DNA, por exemplo, é um teste que permite o reconhecimento bacteriano através da identificação de seqüências específi- cas dos ácidos nucleicos que compõem seu DNA. No dese- nho esquemático acima, qual seqüência corresponde aos oligonucleotídeos expressos à esquerda?", "alts": ["A, C, T, G, G", "C, A, G, T, A", "G, T, A, C, T", "T, A, C, G, T", "T, C, A, T, G"], "gab": "C", "fig": false}, {"ano": 2007, "n": 13, "enun": "O fumo é um dos mais potentes agentes cancerígenos conhecidos que o ser humano introduz voluntariamente no organismo. Dependendo do tipo e da quantidade do tabaco utilizados, os tabagistas apresentam uma probabilidade\n4 a 15 vezes maior de desenvolver câncer de boca do que os não tabagistas. A tabela abaixo mostra os efeitos, no Brasil, da suspensão do tabagismo sobre o risco de câncer de boca estratificado pela localização anatômica.\nLocalização primária do tumor\nBoca (CID-9:\nOutras regiões\nLíngua\n141, 143, (CID-9: 143, 144 (CID-9: 141)*\n144 e 145)* e 145)*\n1,0\n1,0\n1,0\n23,3\n9,3\n5,5\n6,3\n2,9\n1,8\n1,2\n0,6\n0,4\nConsumo de tabaco\nNunca fumaram\nFumantes\nEx-fumantes 1-10 anos\nEx-fumantes >10 anos\n*CID-9: (141) Tumor maligno da língua; (143) Tumor maligno da gengiva; (144) Tumor maligno do pavimento da boca; (145) Tumor maligno de outras partes e de partes não especificadas da cavidade bucal.\nFRANCO e cols. Risk factors for oral cancer in Brazil: a case control study. International Journal of Cancer, 1989, vol. 43, p. 992-1000.\nCom base nos dados fornecidos e no conhecimento dos efeitos do tabagismo sobre o câncer de boca, conclui-se que", "alts": ["existe uma forte relação entre a quantidade de tabaco usada por dia e a duração do período de exposição, aumentando o risco com a cessação do tabagismo.", "políticas educativas para a prevenção do câncer no país devem priorizar ações educativas voltadas para estimular a população a realizar o auto-exame da boca, ao invés de criar programas de cessação do hábito de fumar, pois estes somente mostram resultados a longo prazo.", "o câncer da boca é um dos mais incidentes em homens brasileiros, e sua ocorrência não está associada a outros fatores de risco além do tabagismo.", "após 10 anos de abandono do hábito de fumar, o risco decresce para nível semelhante àquele observado entre os que nunca fumaram.", "na cavidade bucal, a língua e o soalho bucal são as localizações preferenciais de ocorrência do câncer bucal, independente do hábito de fumar, sendo o Sarcoma de Kaposi o tipo histológico mais freqüente."], "gab": "D", "fig": true}, {"ano": 2007, "n": 14, "enun": "De acordo com a Resolução RDC ANVISA n o 306/04 e a\nResolução CONAMA n o 358/05, os Resíduos do Serviço de\nSaúde (RSS) são classificados em 5 grupos: A, B, C, D e E.\nO grupo B engloba as substâncias químicas que podem apresentar risco à saúde pública ou ao meio ambiente, dependendo de suas características de inflamabilidade, corrosividade, reatividade e toxicidade. Esses resíduos merecem atenção especial em todas as suas fases de manejo (segregação, condicionamento, armazenamento, coleta, transporte, tratamento e disposição final).\nFazem parte do grupo B:\nI – resíduos de alginato;\nII – resíduos de agentes cimentantes;\nIII – resíduos de amálgama;\nIV – revelador e fixador radiográficos.\nSão corretos, apenas, os itens", "alts": ["I e II.", "I e III.", "II e III.", "II e IV.", "III e IV."], "gab": "E", "fig": true}, {"ano": 2007, "n": 15, "enun": "As necessidades básicas sociais, psicológicas e educacio- nais das crianças portadoras de necessidades especiais são idênticas às de todas as crianças e podem ser satisfeitas praticamente da mesma maneira. Pacientes com limitações motoras, com deficiência visual, com deficiência auditiva ou de fala, diabéticos, cardiopatas, HIV positivos, pacientes com disfunção renal, defeitos congênitos ambientais ou trans- plantados, sem outras limitações, deverão ser atendidos nas unidades básicas de saúde. Qual conduta determina o atendimento a essas crianças com necessidades especiais, dentro dos princípios bioéticos?", "alts": ["Elaborar novos paradigmas de promoção de saúde, para controle da cárie e da doença periodontal nesse tipo de paciente.", "Prover a unidade de atendimento de equipamentos para sedação com óxido nitroso.", "Disponibilizar atendimento multidisciplinar, com pessoal que possua conhecimento técnico e científico e formação humanística.", "Disponibilizar atendimento às urgências, para eliminação da dor, e tratamento restaurador atraumático.", "Submeter esses pacientes a tratamentos não invasivos, tendo em vista as suas características de saúde."], "gab": "C", "fig": false}, {"ano": 2007, "n": 16, "enun": "Um indivíduo de 30 anos, sexo masculino, teve a condição bu- cal avaliada em exame odontológico periódico em ju- nho de 2006. Nessa data, os exames radiográficos panorâmi- co e periapical apresentaram imagens radiolúcidas arredon- dadas em torno dos ápices dos dois incisivos inferiores. Não existia queixa de dor, nem his- tória de trauma ou de procedi- mento cirúrgico nessa região.\nNEVILLE, B.W. et al.\nPatologia Oral e Maxilofacial. Ao exame clínico, os incisi-\nRio de Janeiro: Editora vos inferiores se apresentavam\nGuanabara Koogan, 1998. íntegros e sem restaurações.\nNas análises de percussão, profundidade de sondagem e palpação na área do vestíbulo, não foram identificados sinais de anormalidades. Em 12/12/2006, novos exames clínicos e radiográficos foram realizados, nos quais foi observada re- dução das imagens radiolúcidas no ápice dos dois inci- sivos. Um ano após (06/06/2007), a radiografia periapical da região de incisivos inferiores apresentou imagem radiográfica dentro dos limites da normalidade. Diante do caso acima re- latado, qual o diagnóstico provável?", "alts": ["Abscessos periapicais múltiplos.", "Granulomas periapicais múltiplos.", "Displasia cementária periapical.", "Cisto periapical de grande extensão.", "Reabsorção óssea periodontal com extensão apical."], "gab": "C", "fig": true}, {"ano": 2007, "n": 18, "enun": "As lesões cariosas que se desenvolvem na face de contato entre os dentes adjacentes normalmente não são visualizadas ao exame clínico, quando em estágio inicial. A radiografia interproximal, como ilustrada nas figuras abaixo, é indicada para investiga- ção de lesões cariosas em dentes posteriores.\nAssinale a afirmativa que está corretamente relacionada à técnica radiográfica interproximal.", "alts": ["Essa técnica radiográfica também é indicada para a visualização de reabsorções ósseas periodontais avançadas.", "O ângulo horizontal deve permitir que o feixe principal de raios X incida perpendicularmente à face proximal do dente mais central da região que está sendo radiografada, evitando a superposição e impedindo a visualização das faces proximais.", "A técnica interproximal, por não atingir todo o longo eixo do elemento dentário, é contra-indicada para avaliação de lesões endodôntica e periodontal combinadas.", "A interpretação da distância entre a junção cemento-esmalte e a crista óssea alveolar é alterada com a técnica radiográfica interproximal, devido à grande proximidade do filme ao objeto (dente).", "Faz-se necessária a realização de 4
