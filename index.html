const DB={"Q": [{"ano": 2023, "n": 1, "enun": "A fome e a insegurança alimentar, anti gos problemas da sociedade, são agravados em regiões com elevados índices de desigualdade social. Propor soluções para esse quadro requer uma abordagem multi dimensional, que possibilite a interação entre as dimensões sociais, culturais, políti cas, econômicas e ambientais envolvidas na produção e na distribuição de alimentos.\nFoto: Unicef/Sayed Bidel. Impacto dos confl itos sobre pessoas mais vulneráveis.\nFoto: Unicef/Safi dy Andriananten. Secas em Madagascar colocam o país africano entre aqueles onde há mais fome.\nDisponível em: htt ps://news.un.org/pt/story/2022/05/1788102. Acesso em: 10 jun. 2023.\nConsiderando o texto e as imagens apresentados, avalie as asserções a seguir e a relação proposta entre elas.\nI. A fome no mundo é um fenômeno biológico e sociológico inevitável.\nPORQUE\nII. A disponibilidade desigual de alimentos, o acirramento de confl itos geopolíti cos, a formação de cadeias agrícolas globais e o aumento das catástrofes climáti cas são fatores que impactam a segurança alimentar de um grande número de populações.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justi fi cati va correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justi fi cati va correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas. MATÉRIA LOGO Foto: FAO/Anatolii Stepanov. Colheita de trigo perto da vila de Krasne, na Ucrânia."], "gab": "D", "fig": true}, {"ano": 2023, "n": 2, "enun": "O crescimento das cidades promove o aumento da demanda por serviços de água tratada, esgotamento sanitário, manejo das águas pluviais, limpeza urbana e coleta de resíduos sólidos. No Brasil, o processo de urbanização ocorreu de forma rápida e desigual, o que resultou no agravamento de injusti ças sociais e econômicas. Os serviços de saneamento básico considerados direitos humanos fundamentais não são acessíveis a uma parcela signifi cati va da população, principalmente àquela em que se concentram os segmentos populacionais em situação de vulnerabilidade.\nO atendimento integral e universalizado junto às populações periféricas e em situação de vulnerabilidade consti tui um grande desafi o, por demandar políti cas públicas e investi mentos subsidiados e permanentes.\nDisponível em: htt ps://www.periodicos.unimontes.br/index.php/verdegrande/ arti cle/view/6018.\nAcesso em: 22 jun. 2023 (adaptado) .\nAcerca do saneamento básico no Brasil, avalie as afi rmações a seguir.\nI. A grave desigualdade social, evidenciada pela segregação nos espaços urbanos, é uma das barreiras para a universalização do acesso aos serviços de saneamento básico.\nII. O serviço de abastecimento de água no Brasil situa-se no mesmo patamar de fornecimento e de infraestrutura que o sistema de coleta e tratamento do esgoto.\nIII. A universalização do acesso aos serviços de saneamento básico requer investi mentos em políti cas públicas e em tecnologias sociais que priorizem a democrati zação e o atendimento às populações em situação de vulnerabilidade.\nIV. O aumento da incidência de doenças transmiti das pela água resulta não somente da inadequação dos serviços de saneamento, mas também da precariedade das condições de moradia da população em situação de vulnerabilidade.\nÉ correto apenas o que se afi rma em", "alts": ["I e II.", "I e IV.", "II e III.", "I, III e IV.", "II, III e IV. MATÉRIA LOGO"], "gab": "D", "fig": false}, {"ano": 2023, "n": 4, "enun": "TEXTO 1\nA Inteligência Arti fi cial (IA) generati va é capaz de criar novos dados, únicos, que possibilitam aprender por conta própria, indo além do que a tecnologia tradicional proporciona, visto que esta precisa de intervenção humana. Um exemplo da IA generati va é o ChatGPT, que pode gerar imagens, músicas e textos completamente novos. Entre outras coisas, por meio da IA generati va, é possível elaborar modelos de previsão de testes clínicos, realizar a identi fi cação de padrões em exames médicos e, ainda, auxiliar no diagnósti co de doenças.\nDisponível em: htt ps://olhardigital.com.br/2023/07/12/internet-e-redes-sociais/ inteligencia-arti fi cial-generati va-o-que-e- como-funciona-e-onde-usar/. Acesso em: 2 ago. 2023 (adaptado).\nTEXTO 2\nAcredita-se que a tecnologia de IA generati va será disrupti va e, portanto, capaz de alterar drasti camente a maneira como o ser humano se relaciona com as máquinas. O uso da IA generati va pode causar importante revolução no segmento de produção de conteúdo. Muitas dessas consequências poderão ser maléfi cas para diversos setores da sociedade. Além do mau uso dessa tecnologia e das questões éti cas, avalia-se que ela pode agravar a desigualdade econômico-social, tanto entre nações quanto entre indivíduos da mesma nação.\nDisponível em: htt ps://canaltech.com.br/inteligencia-arti fi cial/o-que-e-ia-generati va/.\nAcesso em: 2 ago. 2023 (adaptado).\nConsiderando os textos apresentados, é correto afi rmar que a IA generati va", "alts": ["proporciona novos recursos de linguagem que geram tecnologias capazes de realizar interações próprias dos seres humanos.", "restringe o aprendizado ao que é legalmente estabelecido e úti l ao ser humano, o que facilita seu modo de agir no mundo do conhecimento e do trabalho.", "promove a igualdade econômico-social ao substi tuir o ser humano no exercício de profi ssões cujas ati vidades sejam repeti ti vas e exijam pouco conhecimento.", "gera pouco impacto socioeconômico em países com elevado desenvolvimento tecnológico, pois, neles, os processos de criação e inovação já estão bem consolidados.", "esti mula o desenvolvimento intelectual dos seres humanos, uma vez que ela assume parte do conhecimento, resolvendo problemas antes delegados apenas a especialistas. MATÉRIA LOGO"], "gab": "A", "fig": false}, {"ano": 2023, "n": 5, "enun": "Os seguintes ícones foram uti lizados em um estudo realizado por um grupo de trabalho de monitoramento da relação das mulheres com a mobilidade urbana na cidade de São Paulo. Na pesquisa, perguntou-se às mulheres como elas se senti am nas situações representadas por tais imagens.\nAs respostas relati vas a cada ti po de mobilidade urbana são apresentadas a seguir.\nAtenta\nCansada\nInsegura\nAnsiosa\nAndo a pé\nNão ando\nLivre\nAndo de bicicleta\nEm pânico\nApertada\nAndo de trem\nColeti vo Fórum Regional das Mulheres da Zona Norte, Rede MÁS, Sampapé! (2018). Relatório de Análises,\nResultados e Recomendações. Projeto Mulheres Caminhantes! Auditoria de Segurança de Gênero e Caminhabilidade Terminal Santana, São Paulo, SP (adaptado).\nConsiderando o estudo apresentado e relacionando o trabalho de monitoramento social das necessidades de mulheres no contexto urbano aos pressupostos do direito à cidade, avalie as afi rmações a seguir.\nI. A predominância de comentários negati vos indica o medo generalizado que as mulheres sentem ao se deslocarem ati vamente pela cidade, inclusive quanto à percepção de seu corpo no espaço urbano.\nII. Os comentários negati vos sobre os modos coleti vos de transporte estão relacionados à lotação nesses meios e a situações de assédio, tendo sido o metrô avaliado como um espaço um pouco mais seguro para as mulheres, em comparação com outras formas de mobilidade.\nIII. Os comentários negati vos refl etem a percepção das mulheres quanto ao perigo a que se expõem e sugerem que o medo relacionado à vulnerabilidade de gênero aponta para uma geografi a parti cular nas cidades, em que os meios de transporte afetam os movimentos roti neiros das mulheres no espaço urbano.\nÉ correto o que se afi rma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III. MATÉRIA LOGO Desconfortável Insegura Péssima Pego o ônibus Atenta aos assédios Observada Desconﬁada Um pouco mais segura Ando de Metrô Nem ﬁco, tenho medo Passo correndo Frequento o espaço público Em alerta"], "gab": "E", "fig": false}, {"ano": 2023, "n": 7, "enun": "No Brasil, os idosos têm sido cada vez mais obrigados a permanecer no trabalho formal ou informal, mesmo após a aposentadoria, visto que os recursos provenientes desta, na maioria dos casos, são insufi cientes para a manutenção dos indivíduos. Um fator que pode ter agravado essa situação foi a aprovação da reforma previdenciária de 2019, que modifi cou as regras de idade e contribuição para o acesso ao direito ao benefí cio da aposentadoria. Tal mudança pode ter resultado em um número ainda maior de idosos que disputam com as populações jovens e com sistemas de automação, no mercado atual, o trabalho precarizado. Essa situação contribui para o acirramento do preconceito contra essa faixa etária, denominado etarismo.\nConsiderando o texto apresentado, avalie as afi rmações a seguir.\nI. O conceito de etarismo fundamenta-se no fato de os idosos terem capacidade de trabalho reduzida e imporem custo elevado à previdência social, o que compromete a sua sustentabilidade econômica.\nII. As ações legislati vas que visem ao prolongamento do tempo de atuação da população idosa no mercado de trabalho devem ser acompanhadas por uma políti ca de promoção da saúde e da qualidade de vida.\nIII. As ações intergeracionais no mercado de trabalho têm como premissa o desenvolvimento de tecnologias que dotem o idoso de capacidade de trabalho equivalente à de seus colegas jovens.\nÉ correto o que se afi rma em", "alts": ["II, apenas.", "III, apenas.", "I e II, apenas.", "I e III, apenas.", "I, II e III. MATÉRIA LOGO"], "gab": "A", "fig": false}, {"ano": 2023, "n": 8, "enun": "Recentemente, a população carcerária feminina do Brasil tornou-se a terceira maior do mundo.\nA situação do encarceramento feminino por tráfi co de drogas e outras situações que circundam o assunto foi tema de discussão da Secretaria de Políti cas sobre Drogas do Ministério da Justi ça e\nSegurança Pública (Senad/MJSP), em seminário realizado em abril de 2023. O evento contou com a parti cipação de 23 países. Segundo os dados apresentados pela Senad, a incidência penal sobre drogas no Brasil é uma das principais causas de prisão de mulheres, chegando a 54% dos casos de encarceramento, contra 28% dos homens, índice que impacta em aspectos como maternidade e primeira infância.\nDisponível em: htt ps://www.gov.br/mj/pt-br/assuntos/noti cias/senad-discute-situacao-de-mulheres-encarceradas- no-contexto-de-drogas-no-brasil. Acesso em: 15 jun. 2023 (adaptado).\nAcerca do tema apresentado, avalie as asserções a seguir e a relação proposta entre elas.\nI. A maioria das mulheres envolvidas em ati vidades do tráfi co encontra-se em posições hierarquicamente inferiores, sendo classifi cadas como “mulas e aviões”, o que revela a reprodução, no mercado ilegal, da divisão sexual do trabalho observada no mercado formal.\nPORQUE\nII. O sistema penal agrava a situação de vulnerabilidade das mulheres encarceradas, seja pela invisibilização com que as trata, seja por meio da violência insti tucional que reproduz a violência estrutural das relações sociais patriarcais.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justi fi cati va correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justi fi cati va correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas. MATÉRIA LOGO"], "gab": "B", "fig": false}, {"ano": 2023, "n": 10, "enun": "Várias doenças sistêmicas trazem consequências negativas para a cavidade bucal, entre elas, a diabetes mellitus, a qual tem sido associada ao risco aumentado do desenvolvimento e da progressão rápida da periodontite.\nConsiderando a estreita relação entre a diabetes mellitus e a periodontite, avalie as afirmações a seguir.\nI. Os pacientes diabéticos apresentam a atividade de colagenase aumentada, o que causa menos queratinização do epitélio gengival, atraso na maturação dos fibroblastos, prejuízo na cicatrização e reabsorção óssea mais lenta.\nII. As complicações da diabetes mellitus podem acarretar quadros de micro ou macroangiopatias, que favorecem maior vascularização do periodonto e estão, em geral, relacionadas ao caráter hiperinflamatório do tecido gengival do diabético.\nIII. A diabetes mellitus e a periodontite estabelecem um mecanismo bidirecional, em que a periodontite é capaz de alterar o controle glicêmico de indivíduos diabéticos e a diabetes pode interferir negativamente no desfecho do tratamento periodontal.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "gab": "D", "fig": true}, {"ano": 2023, "n": 11, "enun": "A osteonecrose medicamentosa dos maxilares (OMM), complicação bucal importante, tem sido amplamente estudada nos aspectos clínicos e imaginológicos. As setas na radiografia panorâmica apresentada a seguir apontam uma região em que, após anamnese e exame físico, foi diagnosticada a\nOMM.\nPEXE, M. et al. Estudo retrospectivo da osteonecrose dos maxilares associada ao uso de bisfosfonatos sem exposição óssea clínica. SALUSVITA, Bauru, v. 37, n. 4, p. 867-878, 2018.\nConsiderando a imagem apresentada e a literatura atualizada sobre a OMM, avalie as afirmações a seguir.\nI. A imagem radiográfica mostra que as setas apontam para uma região radiolúcida, irregular, com áreas de osteólise e esclerose óssea de bordos maldefinidos, típicos de caso clínico de OMM.\nII. O tempo de utilização de medicações antirreabsortivas por via oral ou mesmo sua associação com os injetáveis deve ser considerado na possibilidade de ocorrência de OMM.\nIII. A ocorrência da OMM é muito associada ao uso dos bisfosfonatos, mas também pode acontecer pelo uso de outras drogas, sobretudo as relacionadas às terapias antirreabsortivas e antiangiogênicas.\nIV. A suspensão no uso de medicamentos antirreabsortivos, por alguns meses antes de procedimentos invasivos, é medida eficiente para a redução do risco de surgimento da OMM.\nV. O exame de Telopeptídeo X (CTx) é muito realizado para avaliar o risco de o paciente desenvolver a OMM após uma cirurgia, visto que o resultado desse exame conduz a um prognóstico seguro, conforme comprovado na literatura.\nÉ correto apenas o que se afirma em", "alts": ["I, II e III.", "I, II e V.", "I, IV e V.", "II, III e IV.", "III, IV e V."], "gab": "A", "fig": true}, {"ano": 2023, "n": 12, "enun": "Um adolescente com 17 anos de idade buscou atendimento odontológico por apresentar sensação de boca seca e sensibilidade, nos dentes superiores, a alimentos frios e doces. Na anamnese, relatou excessiva preocupação com sua estética dental e corporal. O paciente negou uso de antidepressivos e laxantes, apresentando-se com peso normal para sua estatura e faixa etária, apesar do relato de episódios recorrentes de consumo alimentar compulsivo e vômitos, ocorridos nos seis meses anteriores.\nAo exame físico, foi observada biocorrosão dentária com exposição dentinária na face palatina dos dentes anterossuperiores. Constatou-se sialodenose das parótidas com diminuição do fluxo salivar.\nConsiderando-se os dados da anamnese e do exame físico do paciente, a etiologia para as referidas manifestações bucais é", "alts": ["síndrome de Sjögren, porque o paciente apresenta sialodenose das glândulas parótidas e xerostomia.", "diabetes mellitus tipo I, caracterizada pela compulsão alimentar recorrente e manifestações bucais, como xerostomia.", "anorexia nervosa, dada a preocupação excessiva com a imagem corporal e peso normal, apesar da compulsão alimentar.", "bulimia, pois o paciente apresenta excessiva preocupação com a imagem corporal, relata vômitos e peso corporal normal, apesar da compulsão alimentar.", "refluxo gastroesofágico, uma vez que não há uso de antidepressivos e laxantes, além de o paciente apresentar sialodenose das parótidas e xerostomia, características determinantes dessa condição."], "gab": "D", "fig": false}, {"ano": 2023, "n": 13, "enun": "A gravidez é um período de mudanças fisiológicas e psicológicas que interferem diretamente na saúde da gestante. O tratamento odontológico pode ser realizado em qualquer período da gestação, já que os riscos do não tratamento podem ser maiores que os associados à intervenção.\nAcerca de tratamento odontológico de paciente em gestação de baixo risco, avalie as afirmações a seguir.\nI. Quando necessária, a solução anestésica mais indicada, em doses controladas, é a lidocaína a 2% com epinefrina na concentração de 1:100 000, sendo o vasoconstritor essencial para a ação hemostática, o aumento da concentração local do anestésico e o prolongamento do seu efeito.\nII. Na indicação de anti-inflamatórios não esteroides (AINES) e de ácido acetilsalicílico (AAS), deve-se ter extremo cuidado, devido à tendência de causarem hemorragias na gestante e no feto, inércia uterina (contração insuficiente do útero durante ou após o parto) e fechamento prematuro dos canais arteriais do feto.\nIII. Durante a gestação, o tratamento de infecções bucais pode ser realizado com o antibiótico de primeira escolha que é a amoxicilina, visto que ele apresenta ação específica sobre a parede celular bacteriana, com baixo risco à gestante ou ao feto.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "gab": "E", "fig": false}, {"ano": 2023, "n": 14, "enun": "Uma mulher com 22 anos de idade, chegando a um consultório odontológico, mostra, em seu celular, a foto de uma influenciadora digital que apresentava facetas dentais na cor WD (branco opaco), realizadas por um dentista famoso pelas postagens nas redes sociais. A paciente queria que o mesmo tratamento com facetas fosse realizado em seus dentes. Aos exames físico e radiográfico, o profissional verificou a cor dos dentes da paciente, correspondente a B1, ausência de alterações estéticas e oclusais, presença de cálculo supragengival nos incisivos inferiores e uma restauração insatisfatória na oclusal do dente\n36. Após análise do caso, o profissional propôs que fossem realizadas a raspagem inferior, seguida da restauração do dente 36, e a instalação de 20 facetas em resina composta.\nConsiderando o caso apresentado e o tratamento proposto, avalie as asserções a seguir e a relação proposta entre elas.\nI. O tratamento indicado e a respectiva conduta profissional são adequados considerando as necessidades relacionadas à saúde bucal da mencionada paciente.\nPORQUE\nII. O plano de tratamento foi explicado à paciente e, caso ela concorde com sua realização, os aspectos técnico e ético estão contemplados.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "E", "fig": true}, {"ano": 2023, "n": 15, "enun": "A Equipe de Saúde Bucal (ESB), conforme a Estratégia da Saúde da Família (ESF), deve interagir com profissionais de outras áreas, o que permite a abordagem do indivíduo como um todo, atentando, sobretudo, ao contexto socioeconômico e cultural no qual ele está inserido. A ESB deve ser — e se sentir — parte da equipe multiprofissional em unidades de saúde de qualquer nível de atenção.\nNesse contexto, é correto afirmar que os profissionais de Odontologia na ESF devem", "alts": ["focar no trabalho técnico-odontológico.", "limitar-se à execução de ações preventivas no trabalho diário com os pacientes.", "participar de equipes interdisciplinares e multiprofissionais, com enfoque exclusivo no campo biológico da profissão.", "manter relacionamento hierarquizado, o que contribui para a troca de conhecimentos e habilidades na busca do sucesso do tratamento.", "atuar de maneira interdisciplinar, o que resulta na integração de áreas com diferentes conhecimentos, visando à resolução de problemas de modo global. BRASIL. Ministério da Saúde. Política Nacional de Saúde Bucal. 2004 (adaptado)."], "gab": "E", "fig": false}, {"ano": 2023, "n": 16, "enun": "Visando realizar um mapeamento das áreas com teores residuais de flúor em uma comunidade rural, o cirurgião-dentista da Unidade Básica de Saúde (UBS) implementou o heterocontrole do flúor nos poços artesianos que as famílias usavam para o consumo humano.\nConsiderando esse contexto, avalie as asserções a seguir e a relação proposta entre elas.\nI. A realização de um levantamento epidemiológico de condições de saúde-doença da população e a determinação da concentração de flúor nas águas dos poços artesianos contribuem para o planejamento das ações coletivas de saúde.\nPORQUE\nII. O teor de flúor residual na água de poços artesianos de consumo humano na área rural dispensa a realização dos levantamentos epidemiológicos de fluorose dentária.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "C", "fig": false}, {"ano": 2023, "n": 17, "enun": "As diretrizes da Política Nacional de Saúde Bucal (PNSB) apontam para uma reorganização da rede de atenção em saúde bucal, além de definir as atribuições e composição das Equipes de Saúde Bucal (ESB).\nNesse contexto, suponha que, a partir de levantamento epidemiológico em saúde bucal realizado em um município, a prevalência de crianças com 12 anos de idade com cárie não tratada corresponde a 68% do\nCPO-D total. Nesse município, com população de 40 mil habitantes, existem seis Equipes da Saúde da\nFamília (ESF), três ESB do tipo I — 1 Cirurgião-dentista (CD) e 1 Auxiliar de Saúde Bucal (ASB) — e uma\nESB do tipo II — 1CD, 1 Técnico de Saúde Bucal (TSB) e 1 ASB —, além de um CD, que trabalha em consultório isolado atendendo demanda espontânea.\nConsiderando as informações apresentadas e a PNSB, avalie as afirmações a seguir.\nI. A ESB deve priorizar a assistência odontológica em um período de 75% a 85% do total de horas trabalhadas, destinando o tempo restante às atividades coletivas ou de planejamento e capacitação.\nII. A ESB deve interagir com outros profissionais de saúde, para conhecer melhor o território onde atua e as populações mais vulneráveis, utilizando instrumentos de levantamento de necessidade de tratamento.\nIII. A ESB deve fazer um esforço para aumentar a autonomia de pacientes, famílias e comunidades, estimulando práticas de autocuidado, as quais têm impacto direto na ampliação do acesso aos serviços odontológicos.\nIV. A ESB deve fazer o acolhimento da demanda espontânea e dos casos de urgência e estabelecer uma lista de espera.\nV. A ESB deve, entre outras estratégias, aplicar coletivamente o tratamento restaurador atraumático (ART), para controle e redução da infecção bucal.\nÉ correto apenas o que se afirma em", "alts": ["I, II e IV.", "I, II e V.", "I, III e IV.", "II, III e V.", "III, IV e V."], "gab": "B", "fig": false}, {"ano": 2023, "n": 18, "enun": "Uma menina com 5 anos de idade chegou a uma Unidade Básica de Saúde, acompanhada da tia, para atendimento odontológico, com queixa de “dentes frouxos” após queda ao solo ocorrida havia\n3 dias. Durante o exame, a cirurgiã-dentista observou laceração do freio labial superior com edema, equimose na mucosa da região e mobilidade dos incisivos superiores. Verificou também que o dente\n51 apresentava fratura coronária sem envolvimento pulpar, sendo informada pela acompanhante da menina que isso havia sido causado por outra queda, ocorrida havia alguns meses. A profissional constatou que a criança apresentava, em diferentes estágios de evolução, várias áreas de equimose, no pescoço, nos braços e nas pernas, que estavam descobertos.\nConsiderando a situação apresentada, conclui-se que, após prestar os cuidados necessários aos ferimentos da criança, a profissional deve", "alts": ["explicar à acompanhante a necessidade de notificação, redigir um relatório detalhado do caso e encaminhá-lo ao Conselho Tutelar, mesmo que haja apenas suspeita de maus-tratos.", "questionar a criança sobre a possibilidade de estar sofrendo maus-tratos físicos e encaminhá-la para avaliação médica e psicológica, visto não ser a profissional apta a realizar a notificação.", "agendar, para menina, consulta de acompanhamento, a fim de verificar se aparecem novas lesões que confirmem maus-tratos, pois, se estiver equivocada, poderá prejudicar a família com uma notificação enganosa.", "conversar com a acompanhante sobre a possibilidade de a criança estar sofrendo maus-tratos físicos, solicitar a presença dos pais e se abster de compartilhar a suspeita com os colegas ou com a gerência da Unidade, atitude que caracterizaria quebra de sigilo profissional.", "documentar detalhadamente o caso, redigir um relatório e, antes de informar a necessidade de notificação à acompanhante, encaminhar a notificação anonimamente ao Conselho Tutelar, para evitar ser acusada criminalmente se a suspeita de maus-tratos não se confirmar."], "gab": "A", "fig": false}, {"ano": 2023, "n": 19, "enun": "Uma mulher com 40 anos de idade compareceu ao atendimento odontológico com queixa de dificuldade de higienização e mau odor na região do dente 26. Ao exame físico, verificou-se uma lesão de cárie dentária na mesial desse dente, com sensibilidade pulpar positiva. No exame radiográfico, constatou-se uma distância de 1 mm entre o término cervical da lesão e a crista óssea. Verificou-se, ainda, periodontite estágio II localizada e grau B, com bolsas periodontais localizadas de 4 mm, e nível de inserção de 3 mm, além de sangramento à sondagem e biofilme visível, respectivamente, em 20% e\n45% dos sítios. Como tratamento, optou-se inicialmente pela orientação de higiene bucal, adequação do meio, com remoção de biofilme supragengival e do tecido cariado, além de restauração provisória no dente 26, seguidas de instrumentação subgengival. Um mês após a conclusão do tratamento inicial, não havia mais biofilme visível, e apenas 8% dos sítios permaneciam com sangramento à sondagem.\nEntretanto, a região mesial do dente 26 permanecia inflamada.\nConsiderando as informações apresentadas e as opções terapêuticas para o mencionado caso clínico, avalie as asserções a seguir e a relação proposta entre elas.\nI. A realização do aumento de coroa clínica, por meio de osteotomia e osteoplastia associadas a gengivectomia ou retalho reposicionado apical, e a restauração definitiva do dente 26 são opções terapêuticas apropriadas para o caso.\nPORQUE\nII. O tratamento periodontal e o cuidado de suporte adequados de dentes com o periodonto reduzido costumam ser bem-sucedidos a longo prazo.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "B", "fig": true}, {"ano": 2023, "n": 20, "enun": "A dentição mista compreende um período repleto de mudanças durante o crescimento e o desenvolvimento corporal da criança. Maloclusões podem ocorrer nesse período e, conforme a gravidade do caso, o clínico geral poderá indicar o uso de aparelhos ortodônticos e ortopédicos com finalidades preventiva e terapêutica.\nAnalisando-se as arcadas sob uma perspectiva transversal, conclui-se que mordidas cruzadas afetam, com frequência, a dentição mista.\nGUEDES-PINTO, A. C. Odontopediatria. 9. ed. Rio de Janeiro: Santos, 2017 (adaptado).\nAcerca de mordidas cruzadas, avalie as afirmações a seguir.\nI. O plano inclinado fixo é um aparelho indicado para descruzar um incisivo central em casos com espaço suficiente para permitir a vestibularização do dente superior.\nII. A placa de Hawley com parafuso expansor é indicada nos casos em que se deseja promover expansão do arco dentário superior, a fim de corrigir as mordidas cruzadas posteriores do tipo esquelético.\nIII. Na mordida cruzada, quando as relações transversais da linha média dos arcos dentários superiores e inferiores não coincidirem na máxima intercuspidação habitual, o comprometimento é esquelético.\nIV. As mordidas cruzadas dentárias são aquelas em que o cruzamento é provocado por inclinações axiais incorretas no sentido vestibulolingual de um dente ou mais, sem que sejam afetadas as dimensões dos ossos basais.\nÉ correto apenas o que se afirma em", "alts": ["I e III.", "I e IV.", "II e IV.", "I, II e III.", "II, III e IV."], "gab": "B", "fig": false}, {"ano": 2023, "n": 21, "enun": "Uma mulher com 33 anos de idade procurou atendimento odontológico, sem horário agendado, relatando forte dor espontânea e contínua na região do dente 25. Na anamnese, a paciente relatou estar na 24 a semana de gestação e não ser portadora de alergia ou doença sistêmica. No exame físico, observou-se restauração insatisfatória no dente 25. A paciente apresentou dor à palpação e à percussão vertical, não havendo presença de edema intra ou extrabucal. A resposta ao teste de sensibilidade pulpar no dente 25 foi negativa e, nos dentes vizinhos, foi positiva. A imagem radiográfica da região é reproduzida na figura a seguir.\nConsiderando o caso clínico relatado e a imagem radiográfica apresentada, avalie as afirmações a seguir.\nI. O diagnóstico é de abcesso dentoalveolar crônico, cujo tratamento deve ser realizado somente após o final da gestação.\nII. A medicação analgésica de eleição é a dipirona sódica monoidratada.\nIII. As radiografias periapicais, se necessárias, podem ser realizadas durante todo o período gestacional, desde que sejam adotadas medidas de radioproteção.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "B", "fig": true}, {"ano": 2023, "n": 22, "enun": "Uma mulher com 28 anos de idade, em internação hospitalar havia dez dias, decorrente de uma pielonefrite, apresentou complicações, sendo indicada a entubação orotraqueal. A equipe médica solicitou ao cirurgião-dentista do hospital que avaliasse a condição bucal da paciente. No exame intrabucal, o profissional constatou a presença de biofilme e periodontite.\nConsiderando o caso apresentado, avalie as afirmações a seguir.\nI. A paciente apresenta risco de aspiração de patógenos que colonizam a orofaringe, o que aumenta o risco de desenvolvimento de pneumonia nosocomial.\nII. O aumento das citocinas, em resposta à periodontite, pode modificar o epitélio respiratório, o que favorecerá a colonização dos patógenos respiratórios, se a paciente for entubada.\nIII. O potencial de infecção causado pela microbiota bucal independe de o indivíduo estar ou não hospitalizado, pois o que importa são os tipos microbianos presentes na cavidade bucal.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "C", "fig": false}, {"ano": 2023, "n": 23, "enun": "Um homem de 48 anos de idade procurou atendimento odontológico por dor de dente intensa. Ainda na sala de espera, foi aferida a pressão arterial (PA) de 120 x 80 mmHg. Na anamnese, relatou ser portador de hipertensão arterial controlada. No exame físico, foi verificado grande edema na região de fundo de sulco vestibular correspondente ao dente 13. Após a análise da imagem radiográfica, foi sugerido o diagnóstico de abscesso periapical. No momento da intervenção, o paciente encontrava-se agitado e com sudorese intensa. Decidiu-se, então, aferir novamente a PA, obtendo-se o resultado de 170 x 90 mmHg, em dois momentos distintos.\nConsiderando essas informações, a conduta adequada para o caso é", "alts": ["prescrever medicação analgésica e anti-inflamatória não esteroide para controle dos sintomas de urgência e agendar retorno do paciente em 7 dias, para se executar o procedimento operatório.", "encaminhar o paciente a um cardiologista, para a avaliação do controle da hipertensão, e, posteriormente, realizar o procedimento operatório de urgência.", "realizar o procedimento em nível ambulatorial, com controle de ansiedade, verbal e/ou medicamentoso, e, caso constatado o retorno aos níveis normais da PA, solucionar a situação de urgência.", "realizar o procedimento em nível ambulatorial, tendo a cautela de utilizar anestésico local de longa duração sem vasoconstritor, com limite máximo de 1 tubete.", "realizar o procedimento operatório de urgência sob anestesia geral, tendo em vista a evidente instabilidade no controle da pressão arterial."], "gab": "C", "fig": true}, {"ano": 2023, "n": 24, "enun": "Uma mulher com 65 anos de idade compareceu à Unidade Básica de Saúde. Durante a anamnese, relatou sangramento na gengiva, sensação de boca seca e episódios de “queimação” na língua e na mucosa jugal. Ao exame físico, observou-se gengiva edemaciada, sangramento ao simples toque, bolsas periodontais profundas, glossite com fissuras sintomáticas e diversas lesões de cárie. Nas imagens radiográficas, os dentes e a estruturas ósseas do complexo maxilomandibular sugeriam forma e desenvolvimento normais.\nNesse caso, as alterações bucais apresentadas são comuns em pacientes com", "alts": ["hipotireoidismo.", "hipopituitarismo.", "diabetes mellitus.", "síndrome de Turner.", "hiperparatireoidismo."], "gab": "C", "fig": false}, {"ano": 2023, "n": 25, "enun": "Uma mulher com 36 anos de idade, ao procurar uma clínica odontológica, solicitou a cimentação de prótese unitária do dente 11, informando trabalhar como recepcionista de um hotel e não poder apresentar-se sem a prótese fixa anterior, que havia soltado naquele dia. Aos exames físico e radiográfico, foram constatadas periodontite estágio III localizada, grau C, restaurações insatisfatórias, lesões de cárie extensas, ausência dos dentes 15, 26, 36 e 46, além de tratamento endodôntico insatisfatório do dente 11. Foram observadas, ainda, lesões radiolúcidas periapicais nos dentes 11, 34 e 44, e o dente 38 apresentava-se semi-incluso, com lesão de cárie extensa.\nConsiderando a situação apresentada e os procedimentos odontológicos adequados, avalie as afirmações a seguir.\nI. A cimentação provisória da prótese unitária do dente 11 deve ser considerada prioritária na sequência terapêutica.\nII. Os dentes com lesões de cárie extensas, para controle de infecção, deverão ser restaurados com resina composta na fase de adequação do meio bucal.\nIII. As fases I e II do tratamento periodontal deverão anteceder os tratamentos endodônticos e restauradores.\nIV. A remoção cirúrgica do dente 38 deve ser realizada previamente ao tratamento restaurador e protético.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "II e IV.", "III e IV.", "I, II e III.", "I, III e IV."], "gab": "E", "fig": true}, {"ano": 2023, "n": 26, "enun": "Uma criança com 8 anos de idade, ao cair de uma escada, teve avulsão do dente 21 e foi levada, com esse dente na mão, à enfermaria da escola.\nConsiderando essa situação e a conduta imediata adequada, avalie as afirmações a seguir.\nI. O responsável pela criança deve procurar atendimento odontológico de urgência, para que o dentista reimplante esse dente em até 12 horas.\nII. O dente deve ser colocado imediatamente no alvéolo, pela criança ou pelo responsável, após cuidados mínimos de higiene, como lavagem do dente em água corrente ou soro fisiológico.\nIII. O dente avulsionado deve ser mantido em solução fisiológica, leite ou saliva, se for impossível o reimplante imediato, sendo nesse caso o período extra-alveolar de, no máximo, 60 minutos.\nIV. O dente, caso apresente sujidades evidentes (areia e terra), deve ser lavado com soro fisiológico, limpo vigorosamente em sua superfície radicular e posicionado imediatamente no alvéolo.\nV. O dente avulsionado, após reimplante, deve ser estabilizado passivamente com fio de aço flexível ou fio de nylon por 2 semanas, evitando-se posicionar o material de fixação (resina) próximo à região cervical\nÉ correto apenas o que se afirma em", "alts": ["I, II e III.", "I, II e IV.", "I, IV e V.", "II, III e V.", "III, IV e V."], "gab": null, "fig": false}, {"ano": 2023, "n": 28, "enun": "O tipo de aleitamento da criança e os hábitos bucais deletérios, como sucção de dedo e chupeta, podem contribuir para o desenvolvimento de maloclusões, porque rompem o equilíbrio natural das forças intrabucais (musculatura da língua) e extrabucais (lábios e bochecha).\nConsiderando as informações apresentadas, avalie as afirmações a seguir.\nI. O aleitamento materno previne o desenvolvimento de hábitos de sucção não nutritivos, diminuindo-se o risco de desenvolvimento de maloclusão.\nII. O acompanhamento e o aconselhamento de gestantes a respeito dos cuidados durante o parto e período puerperal devem ser realizados com incentivo ao aleitamento materno, de forma exclusiva, por 6 meses, e de forma complementar, por dois anos ou mais.\nIII. No aleitamento artificial com bicos de mamadeira ortodônticos, o padrão de movimentos musculares do bebê é o mesmo que o observado no aleitamento materno e, portanto, ambos propiciam estímulo semelhante para o desenvolvimento do terço médio da face.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "C", "fig": false}, {"ano": 2023, "n": 29, "enun": "Uma mãe chega com seu filho de 2 anos e 6 meses de idade para consulta odontológica de rotina.\nEla refere não haver presença de doença sistêmica. Ao exame físico, o dentista verifica lesões cavitadas envolvendo as superfícies oclusais dos dentes 75 e 85, além de lesões de mancha branca com aspecto rugoso e opaco nas superfícies vestibulares dos dentes 53 e 63. Adicionalmente, observa acúmulo de biofilme, principalmente na região dos molares decíduos.\nConsiderando essa situação e a conduta a ser adotada pelo profissional no tratamento do referido paciente, avalie as afirmações a seguir.\nI. O profissional deve, no atendimento, procurar envolver o núcleo familiar nas ações de orientação e motivação para a saúde bucal da criança.\nII. Por se tratar de criança com alta atividade de cárie, deve ser prescrita solução de fluoreto de sódio 0,05% para bochecho diário.\nIII. As lesões cavitadas dos dentes 75 e 85 devem ser restauradas com material restaurador à base de ionômero de vidro.\nIV. Por envolverem área estética, as lesões nos dentes 53 e 63 devem ser restauradas com resina composta.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "B", "fig": false}, {"ano": 2023, "n": 30, "enun": "Na área odontológica, é essencial incorporar rotinas e normas do gerenciamento dos resíduos biológicos e químicos. No planejamento dessas ações na prestação de serviços em saúde, devem ser observados os princípios da biossegurança, de modo a salvaguardar a saúde de todos os atores envolvidos.\nCom base nas normas de biossegurança da Odontologia, avalie as afirmações a seguir.\nI. O cirurgião-dentista, caso sofra lesão perfurocortante na pele envolvendo sangue de um paciente, deve espremer a região afetada e lavar de maneira abundante a ferida com água corrente e sabão, pois, assim, reduz significativamente os riscos de contaminação.\nII. O profissional acidentado com material biológico, em consultório, deve dirigir-se imediatamente ao Centro de Referência no atendimento de acidentes ocupacionais de sua região para ser submetido à conduta adequada para o caso e, em seguida, deverá comunicar o fato ao Técnico de Segurança do Trabalho, para registro e notificação.\nIII. O descarte de lâminas de bisturi usadas e de seus invólucros deve ser realizado em recipiente de resíduo de saúde do grupo A, ou seja, sacos plásticos branco leitosos contendo identificação de material biológico contaminado.\nIV. A sequência adequada para processamento dos instrumentais reutilizáveis, considerando-se a eficácia no controle de contaminação, é a imersão em detergente enzimático, lavagem com remoção de todo material orgânico visível, secagem, empacotamento e esterilização por calor úmido sob pressão.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "C", "fig": false}, {"ano": 2023, "n": 31, "enun": "Uma mulher com 35 anos de idade compareceu à clínica odontológica queixando-se da perda recente da restauração do dente 46. Na anamnese, relatou que havia 5 anos que tinha quebrado o dente comendo pão (depois soube que havia cárie), foram realizados tratamento endodôntico e restauração em amálgama. Após isso, passou a ter dores frequentes no dente ao mastigar e constante inflamação na região da papila distal até a perda da restauração. O exame físico revelou padrão de higienização adequado e facetas de desgaste nos dentes posteriores, características de parafunção. Observou-se uma trinca que se iniciava na crista mesial do dente, estendendo-se até o assoalho da câmara pulpar, conforme mostra a figura a seguir. Ademais, o exame radiográfico do dente 46 demonstrou tratamento endodôntico satisfatório e margem distal da cavidade ao nível da crista óssea.\nCom base no caso clínico apresentado, avalie as afirmações a seguir.\nI. Após tratamento endodôntico, é indicado uso de retentor intrarradicular, para aumentar a resistência do dente e a retenção da restauração em amálgama.\nII. A amplitude da restauração em amálgama, o remanescente dentário, a ausência da parede distal e o fato de o paciente apresentar parafunção, provavelmente, contribuíram para a trinca existente.\nIII. A inflamação constante na região da papila distal do dente 46 teria sido evitada se a matriz e a cunha tivessem sido corretamente utilizadas na execução da restauração.\nIV. Após a endodontia, poderia se indicar a base ou o preenchimento com resina composta de baixa contração, seguindo-se a realização de coroa total ou onlay com cobertura das cúspides.\nÉ correto apenas o que se afirma em", "alts": ["I e IV.", "II e III.", "II e IV.", "I, II e III.", "I, III e IV."], "gab": "C", "fig": true}, {"ano": 2023, "n": 32, "enun": "Historicamente, as práticas da Saúde Bucal no setor de saúde indicam que elas foram desenvolvidas restringindo-se à prática do cirurgião-dentista em seu consultório odontológico. Atualmente, com a incorporação das ações de Saúde Bucal pelas Equipes da Família visa-se transpor esse modelo de organização e prática anteriores, o que é altamente desafiador, visto que procura-se integrar a prática dos diferentes atores da equipe.\nBRASIL. Ministério da Saúde. A saúde bucal no Sistema Único de Saúde. Brasília: Ministério da Saúde, 2018 (adaptado).\nConsiderando o texto apresentado, avalie as afirmações a seguir, relativas a atribuições específicas dos cirurgiões-dentistas (CD) que atuam na Atenção Primária em Saúde por meio da Estratégia da Saúde da\nFamília (ESF).\nI. O CD deve realizar os procedimentos clínicos e cirúrgicos em saúde bucal, incluindo atendimento das urgências, pequenas cirurgias ambulatoriais e procedimentos relacionados às fases clínicas do tratamento protético.\nII. O CD deve coordenar e participar de ações coletivas voltadas à promoção da saúde e à prevenção de doenças bucais.\nIII. O CD deve coordenar a manutenção e conservação dos equipamentos odontológicos.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "C", "fig": false}, {"ano": 2023, "n": 33, "enun": "O esmalte dentário pode apresentar alterações em sua estrutura como hipoplasia, hipomineralização, fluorose e lesões de mancha branca por cárie. Essas alterações têm fatores etiológicos diferentes e precisam ser identificadas corretamente para o estabelecimento do tratamento adequado e embasamento do desenvolvimento de políticas públicas.\nConsiderando o texto apresentado, avalie as afirmações a seguir.\nI. A hipoplasia é um defeito qualitativo, pois o esmalte dentário com espessura normal se apresenta com opacidade, o que pode provocar comprometimento estético e hipersensibilidade dentária.\nII. A fluorose é passível de prevenção com o controle da fluoretação das águas de abastecimento e da utilização de produtos fluoretados.\nIII. A hipomineralização de molar/incisivo (HMI) é um defeito qualitativo do esmalte dentário, de etiologia desconhecida e espessura de esmalte normal, porém poroso e susceptível à fratura; dentes com HMI mais severa são mais susceptíveis ao desenvolvimento de cárie.\nIV. A fluorose dentária é uma alteração na mineralização durante o processo de maturação da matriz do esmalte, que o torna mais resistente à cárie.\nÉ correto apenas o que se afirma em", "alts": ["I e IV.", "II e III.", "III e IV.", "I, II e III.", "I, II e IV."], "gab": "B", "fig": false}, {"ano": 2023, "n": 34, "enun": "Um homem com 55 anos de idade procurou tratamento odontológico na sua Unidade Básica de\nSaúde (UBS) com queixa de dor espontânea no dente 47. O paciente era obeso e durante a anamnese, relatou ter dislipidemia, hiperglicemia, hipertensão arterial e um quadro depressivo. Ao exame físico, foi constatada a presença de inúmeros dentes com lesões de cárie, além do dente 47, e gengivite generalizada. A abordagem de tratamentos nesta UBS segue modelo do Projeto Terapêutico Singular (PTS) com proposta interdisciplinar e multiprofissional.\nCom base na situação apresentada, avalie as asserções a seguir e a relação proposta entre elas.\nI. A abordagem desse paciente, respeitando-se os princípios de clínica ampliada, deverá seguir a seguinte sequência: diagnóstico; tratamento odontológico; encaminhamento para cardiologista, nutricionista, profissional de educação física, psiquiatra e psicólogo, com retornos periódicos estabelecidos por cada profissional que o atendeu.\nPORQUE\nII. A metodologia estabelecida com base nos objetivos do Projeto Terapêutico Singular, que é um conjunto de propostas terapêuticas articuladas para um sujeito individual ou coletivo, se desenvolve firmado em quatro pilares: diagnóstico, definição de metas, divisão de responsabilidade e reavaliação.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "D", "fig": true}, {"ano": 2023, "n": 35, "enun": "O sistema digital de captação de imagens apresenta inúmeras vantagens em relação ao convencional, tais como eliminação de resíduos inerentes ao processamento químico e uso de sensores radiográficos que eliminam o descarte do invólucro do filme.\nConsiderando as diferenças entre a radiografia convencional e a digital, avalie as afirmações a seguir.\nI. O resíduo produzido pelo sistema de radiografia digital é proveniente dos sensores descartáveis, das suas embalagens e dos plásticos das barreiras de proteção utilizados para se evitar a contaminação cruzada.\nII. A redução de até 80% da dose de radiação utilizada para obtenção da imagem no sistema digital não interfere na espessura das proteções das paredes e portas do ambiente em que os aparelhos estão instalados.\nIII. O tempo de processamento no sistema convencional, para a tomada radiográfica intrabucal com revelação e fixação, é inferior ao do processamento digital obtido por meio de scanner de placas de fósforo, embora com produção de resíduos.\nIV. Uma vantagem expressiva das radiografias digitais consiste na maior facilidade de aplicação das técnicas de obtenção de imagens com ângulos mais precisos e inclinações mais favoráveis ao posicionamento do paciente.\nÉ correto apenas o que se afirma em", "alts": ["II.", "IV.", "I e III.", "I e II.", "III e IV."], "gab": "A", "fig": true}, {"ano": 2023, "n": 36, "enun": "Um menino com 5 anos de idade foi trazido pela mãe para atendimento odontológico. Durante a anamnese, a mãe relatou que a criança nunca tinha sido consultada por um cirurgião-dentista e mostrava medo do ambiente odontológico. Relatou, ainda, ter percebido algumas cavidades nos dentes posteriores do filho, sem que ele tivesse se queixado de dor estimulada ou espontânea. Além disso, a mãe descreveu a criança como muito introvertida, mas ponderou que a criança permitiria a realização dos procedimentos odontológicos, demonstrando autoridade e controle sobre o filho. A criança mostrou-se arredia ao diálogo com o profissional e direcionava o olhar para a mãe antes de responder a qualquer indagação.\nAcerca da situação apresentada, avalie as afirmações a seguir.\nI. O profissional deve utilizar a técnica falar-mostrar-fazer, para que a criança entenda os procedimentos que serão realizados.\nII. A criança precisa ser estimulada a falar, para que, assim, a ansiedade e o sofrimento diante de uma situação desconhecida sejam reduzidos e ela expresse o que está sentindo.\nIII. O comportamento da criança possibilita que o profissional realize o procedimento odontológico, sem necessidade de condicionamento.\nIV. A mãe deve permanecer na sala clínica durante o atendimento odontológico, para que o filho permita a realização do tratamento.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "A", "fig": false}, {"ano": 2023, "n": 37, "enun": "Um jovem de 26 anos de idade compareceu a uma Unidade Básica de Saúde em busca de tratamento odontológico com o desejo de fazer uma limpeza nos dentes. Durante a anamnese, relatou sensação de boca seca. Ainda informou ser tabagista, com uso de cigarro convencional dos 15 aos 18 anos de idade, tendo depois passado a usar o cigarro eletrônico, por acreditar que este fosse menos prejudicial à sua saúde. Ao exame físico, o cirurgião dentista verificou presença de periodontite, manchas extrínsecas amareladas e diversas lesões cariosas e não cariosas, além de desgastes nas bordas incisais dos dentes anteroinferiores. O cirurgião dentista, com base nos sinais presentes e sintomas relatados, atribuiu os achados clínicos ao uso do cigarro eletrônico.\nSobre as possíveis justificativas da atribuição do uso do cigarro eletrônico às condições encontradas no caso descrito, avalie as afirmações a seguir.\nI. O uso de cigarros eletrônicos é dissociado do risco de progressão da periodontite, uma vez que é incapaz de modificar a microbiota subgengival e a resposta imune do indivíduo.\nII. Os cigarros eletrônicos apresentam, na sua composição, substâncias químicas com propriedades ácidas e, portanto, seu uso por período prolongado está relacionado à biocorrosão dentária.\nIII. O uso do cigarro eletrônico, além de alterar o pH salivar, altera o equilíbrio da microbiota bucal, levando o hospedeiro a maior susceptibilidade às lesões cariosas.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "D", "fig": false}, {"ano": 2023, "n": 38, "enun": "Um recém-formado planeja abrir uma clínica odontológica em uma grande capital brasileira, associando-se a um empresário de sucesso, disposto a investir financeiramente no negócio.\nO empresário disponibilizou espaço em um shopping movimentado para a instalação da clínica e apresentou propostas para alavancar o estabelecimento.\nConsiderando o Código de Ética Odontológica e a Resolução do CFO 196/2019, avalie as afirmações a seguir, a respeito das propostas idealizadas pelo sócio.\nI. A criação de um perfil profissional do cirurgião dentista no Instagram, para divulgação de instruções relativas à saúde bucal e de imagens iniciais e finais dos casos clínicos atendidos por ele, é uma ação que pode ser realizada, desde que haja a anuência formal do paciente e garantia do sigilo em relação à sua identidade.\nII. A realização de convênios com as lojas do shopping, oferecendo aos clientes clareamento dental e profilaxia sem ônus, como “vale-presente”, é uma ação de marketing que pode ser implementada, uma vez que poderia atrair maior público à clinica.\nIII. O estabelecimento de parcerias com as escolas privadas do bairro para realização de exames clínicos e distribuição de material publicitário é uma ação indicada, pois propicia uma abordagem educativa do tema, além da divulgação dos serviços da clínica.\nÉ correto apenas o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III. QUeSTIoNÁrIo De PerCePÇÃo DA ProVA As questões abaixo visam conhecer sua opinião sobre a qualidade e a adequação da prova que você acabou de realizar. Assinale as alternativas correspondentes a sua opinião nos espaços apropriados do CArTÃo-reSPoSTA. AVALIAÇÃo GLoBAL DA ProVA"], "gab": "A", "fig": false}, {"ano": 2019, "n": 1, "enun": "O regime internacional de mudanças climáticas, organizado no âmbito do Sistema das Nações Unidas há 24 anos, constitui, em essência, um arranjo institucional dinâmico e de construção permanente.\nCriado para facilitar o entendimento e promover a cooperação entre as 195 partes signatárias, é dotado de estrutura jurídica e organizacional próprias. A Convenção Quadro das Nações Unidas sobre mudanças climáticas prevê mecanismos para a solução dos conflitos e para promoção da cooperação entre os\nEstados nacionais.\nDisponível em: <http://dx.doi.org/10.18623/rvd.v14i29.996>. Acesso em: 22 jul. 2019 (adaptado).\nA partir do contexto apresentado, é correto afirmar que a Convenção Quadro das Nações Unidas sobre mudanças climáticas objetiva", "alts": ["estimular atores estatais e não estatais a planejar e a executar conjuntamente programas dedicados a garantir a redução da interferência humana no meio ambiente.", "evitar a propagação do efeito estufa por meio da criação de projetos que visem à redução das emissões a partir de medidas compensatórias, como plantação de árvores e melhor utilização de recursos naturais.", "estabelecer mecanismos flexíveis destinados a permitir que países que não utilizam toda a sua quota prevista de emissões vendam o seu excedente a outros que necessitam de limites maiores.", "promover o princípio da responsabilidade comum e demandas diferenciadas para permitir que os países desenvolvidos alterem a média global de aumento da temperatura acordada.", "assegurar a continuidade dos compromissos para que as metas de redução de emissão mantenham-se regulares e estáveis ao longo dos próximos vinte anos."], "gab": null, "fig": true}, {"ano": 2019, "n": 2, "enun": "p a p a a b p a a a w b w b w b\nAugusto de Campos é um artista concretista brasileiro cuja poética estabelece a relação de diálogo entre o aspecto visual, sonoro e tátil do texto verbal.\nCom base no poema apresentado, avalie as afirmações a seguir.\nI. O aspecto sensorial é construído por meio da exploração da dimensão visual das palavras, sendo a imagem um elemento essencial do texto.\nII. O artista utiliza técnicas de diagramação, harmonizando os componentes gráficos e espaciais, que se transformam em elementos de construção de sentidos diversos.\nIII. A impressão de movimento caótico cria o efeito de uma espécie de big-bang que atua sobre ambas as palavras: poema e bomba.\nIV. A utilização do espaço é secundária para a construção de sentidos da obra, já que a palavra escrita, nesse caso, é suficiente para a leitura do poema.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "II e IV, apenas.", "III e IV, apenas.", "I, II e III, apenas.", "I, II, III e IV. b b o o o o o o w w w w w w CAMPOS, A. Despoesia. São Paulo: Perspectiva, 1994 (adaptado)."], "gab": "D", "fig": true}, {"ano": 2019, "n": 3, "enun": "Na história das civilizações humanas, a agricultura esteve relacionada à origem de um fenômeno que se tornaria o marco da economia alimentar: o aumento demográfico. Entretanto, apesar de toda a força civilizatória da agricultura, muitos povos tornaram-se vulneráveis por falta de alimentos.\nMesmo com o aumento do volume de alimentos, o número de indivíduos subnutridos é grande, como demonstrado pelos dados estatísticos da Organização das Nações Unidas para a Agricultura e Alimentação (FAO). A análise dos dados revela que, até 2014, a quantidade de pessoas desnutridas no mundo estava diminuindo, porém, entre 2015 e 2017, esse número aumenta.\nLIMA, J. S. G. Segurança alimentar e nutricional: sistemas agroecológicos são a mudança que a intensificação ecológica não alcança.\nCiência e Cultura, v. 69, n. 2, 2017 (adaptado).\nConsiderando a segurança alimentar e a nutrição no mundo, avalie as afirmações a seguir.\nI. O conceito de segurança alimentar e nutricional admite que a fome e a desnutrição são problemas de oferta adequada e garantia de alimentos saudáveis, respeitando-se a diversidade cultural e a sustentabilidade socioeconômica e ambiental.\nII. A segurança alimentar e nutricional compreende a produção e a disponibilidade de alimentos, bem como o acesso à alimentação adequada e saudável.\nIII. A escassez da oferta de alimentos nas últimas décadas decorre da falta de processos de produção e disseminação tecnológica que garantam a produção no campo frente às mudanças climáticas.\nÉ correto o que se afirma em", "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "C", "fig": true}, {"ano": 2019, "n": 4, "enun": "Segundo resultados da última Pesquisa Nacional de Saneamento Básico (PNSB) de 2008, a quase totalidade dos municípios brasileiros tinha serviço de abastecimento de água em pelo menos um distrito (99,4%). Além da existência da rede, uma das formas de se avaliar a eficiência do serviço de abastecimento de água à população é examinar o volume diário per capita da água distribuída por rede geral. No ano de 2008, foram distribuídos diariamente, no conjunto do país, 320 litros per capita, média que variou bastante entre as regiões. Na Região Sudeste, o volume distribuído alcançou\n450 litros per capita, enquanto na Região Nordeste ele não chegou à metade desta marca, apresentando uma média de 210 litros per capita. Embora o volume total tenha aumentado em todas as regiões do país, comparando-se com os números apresentados pela PNSB de 2000, as diferenças regionais permaneceram praticamente inalteradas.\nDisponível em: <https://biblioteca.ibge.gov.br/index.php/biblioteca-catalogo?view=detalhes&id=280933>\nAcesso em: 01 out. 2019 (adaptado).\nCom base nas informações apresentadas, avalie as asserções a seguir e a relação proposta entre elas.\nI. Em algumas regiões do Brasil, os índices referidos estão abaixo da média nacional, indicando diferenças de acesso de qualidade a abastecimento de água que podem impactar a saúde pública.\nPOrQUe\nII. O aumento da eficiência da política pública de abastecimento de água no Brasil contribui para o desenvolvimento nacional, para a redução dos desequilíbrios regionais e para a promoção da inclusão social.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira e a II é uma proposição falsa.", "A asserção I é uma proposição falsa e a II é uma proposição verdadeira.", "As asserções I e II são falsas."], "gab": "B", "fig": true}, {"ano": 2019, "n": 6, "enun": "Conforme dados do Atlas da Violência 2019, apresentados no gráfico a seguir, verifica-se o crescimento no número de homicídios de mulheres no país durante o período de 2007 a 2017. Nesse período, a taxa de homicídios entre as mulheres negras cresceu mais do que a taxa de homicídios entre as mulheres não negras. A classificação de raça/cor do IBGE agrega negras como a soma de pretas e pardas e não negras como a soma de brancas, amarelas e indígenas.\n6,0\nNúmero de casos por 100 mil habitantes\n5,3\n5,2\n4,9\n5,0\n4,6\n4,3\n4,0\n3,3\n3,2\n3,2\n3,1\n3,0\n3,0\n2,0\n1,0\n0,0\n2008\n2009\n2010\n2011\nNegras\nInstituto de Pesquisa Econômica Aplicada (IPEA); Fórum Brasileiro de Segurança Pública (Orgs.).\nAtlas da violência 2019. Brasília: Ipea, 2019 (adaptado).\nConsiderando as informações apresentadas, avalie as asserções a seguir e a relação proposta entre elas.\nI. O maior crescimento dos casos de homicídios de mulheres negras em comparação com os casos de mulheres não negras indica a relevância dos estudos a respeito das múltiplas variáveis relacionadas a este fenômeno social.\nPOrQUe\nII. A análise do gráfico permite concluir que, no início da série histórica, havia um contexto favorável à superação da situação social de maior vulnerabilidade da mulher negra, em razão da menor diferença entre as taxas de homicídios.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira e a II é uma proposição falsa.", "A asserção I é uma proposição falsa e a II é uma proposição verdadeira.", "As asserções I e II são falsas. 5,6 5,6 5,5 5,5 5,4 5,3 3,3 3,2 3,2 3,2 3,1 3,1 2012 2013 2014 2015 2016 2017 Anos Não Negras"], "gab": "C", "fig": true}, {"ano": 2019, "n": 9, "enun": "Um paciente de 75 anos de idade, desdentado parcial por doença periodontal ativa, sofreu\nA Resolução n. 196, de 29 de janeiro de 2019, um acidente vascular cerebral há 20 dias e do Conselho Federal de Odontologia (CFO), que permanece internado em UTI. Durante as trata da divulgação de autorretratos e de imagens tentativas de remoção do tubo endotraqueal, relativas ao diagnóstico e aos resultados de não conseguiu manter a frequência respiratória tratamentos odontológicos, enuncia: “O direito em níveis satisfatórios, sendo novamente à inviolabilidade da imagem é regulamentado na entubado. Há três dias, foi diagnosticado quadro\nConstituição Federal como garantia fundamental e de pneumonia associada a ventilação mecânica o Código Civil Brasileiro, no artigo 20, regulamenta (PAVM). O infectologista realizou coleta da a possibilidade de disponibilidade dessa garantia secreção pulmonar, do corredor bucal e do biofilme dental para antibiograma. Em conversa por terceiros perante autorização prévia e expressa com a equipe hospitalar, a família foi informada de utilização por quem de direito”. que a PAVM é uma ocorrência comum em pacientes entubados na UTI. teXtO ii teXtO i\nConforme o Código de Ética Odontológica, capítulo III, artigo 9: “Constituem deveres fundamentais dos inscritos: zelar e trabalhar pelo perfeito desempenho ético da Odontologia e pelo prestígio e bom conceito da profissão; abster-se da prática de atos que impliquem mercantilização da Odontologia ou sua má conceituação”.\nConsiderando as informações apresentadas e a divulgação de casos clínicos em mídias sociais, é correto afirmar que o cirurgião-dentista poderá", "alts": ["realizar autorretratos acompanhado de seu paciente e publicá-los a partir do momento que o paciente concorde em realizar a fotografia e assine no prontuário de tratamento.", "publicar imagens (iniciais e finais) do tratamento, desde que o paciente tenha assinado o Termo de Consentimento Livre e Esclarecido e o dentista informe seu nome e sua inscrição no CRO.", "publicar fotografias de dentes já extraídos, não expondo a imagem e o nome do paciente, desde que verbalmente autorizado por ele.", "publicar vídeos de procedimentos para fins didáticos e/ou de esclarecimentos sobre determinados tratamentos realizados.", "utilizar mídias sociais como ferramenta de marketing para a divulgação de seu consultório, tratamentos que realiza e preços praticados."], "gab": "B", "fig": true}, {"ano": 2019, "n": 10, "enun": "Considerando o caso apresentado, avalie as afirmações a seguir.\nI. A colonização de patógenos respiratórios no biofilme bucal indica que cuidados de higienização de dentes e mucosas podem prevenir essa complicação.\nII. A condição de higiene bucal desse paciente acarretou desequilíbrio da microbiota residente e levou ao aumento da possibilidade de PAVM, agravando o acidente vascular cerebral.\nIII. A complexidade do biofilme bucal e da doença periodontal desse paciente é a provável fonte da infecção nosocomial, pois as bactérias bucais frequentemente são aspiradas durante a entubação.\nIV. A introdução de protocolo operacional de prevenção da PAVM na UTI desse hospital, incorporando os cuidados com a saúde bucal e uso de clorexidina 0,12% na rotina da equipe, reduzirá o índice de pneumonia.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "D", "fig": false}, {"ano": 2019, "n": 11, "enun": "A auxiliar de saúde bucal (ASB) de um cirurgião- dentista (CD) acidentalmente perfurou o seu dedo ao tentar reencapar manualmente uma agulha que havia sido utilizada em um paciente e seria descartada. Houve sangramento e ela lavou as mãos com água corrente e sabão para, em seguida, continuar suas tarefas. Ao perceber o ocorrido, o CD informou-a prontamente que deveriam tomar as devidas providências.\nConsiderando o caso apresentado e os protocolos de biossegurança em saúde, avalie as afirmações a seguir.\nI. O reencape manual de agulhas é contraindicado, devido ao alto risco de acidentes, porém, para agulha em seringa carpule, caso necessário, o reencape deve ser feito utilizando a própria seringa de modo a \"pescar\" a capa da agulha na bandeja.\nII. A ASB deve dirigir-se ao Centro de\nReferência no atendimento de acidentes ocupacionais para comunicar o fato ao técnico em segurança do trabalho, preencher o inquérito de notificação e realizar os exames necessários, mesmo diante de uma possível recusa do paciente em acompanhá-la.\nIII. Em caso de resultado positivo da sorologia rápida para HIV do paciente, a profissional acidentada, salvo se gestante, deve iniciar de imediato o esquema antirretroviral, a ser seguido por 30 dias, e o paciente deve ser encaminhado para avaliação médica do estágio atual da doença.\nIV. O protocolo antirretroviral pós-exposição acidental com material biológico deve ser iniciado o mais breve possível dentro de um período máximo de sete dias após o acidente, para que se obtenha a eficácia profilática adequada.\nÉ correto apenas o que se afirma em", "alts": ["I e III.", "I e IV.", "II e IV.", "I, II e III.", "II, III e IV."], "gab": null, "fig": false}, {"ano": 2019, "n": 12, "enun": "Um paciente de 12 anos de idade compareceu a uma clínica de odontopediatria de um serviço público de saúde, acompanhado da mãe, para realização de tratamento. Após anamnese, exame clínico e exames radiográficos, o cirurgião-dentista que o atendeu observou: lesão de mancha branca, opaca e rugosa, sem cavitação, na cervical da superfície vestibular do dente 34; lesão cariosa de média profundidade na superfície oclusal do dente 35, sem envolvimento de cúspide, de coloração escurecida, margens definidas e sem halo de mancha branca nos bordos da cavidade; lesão cariosa profunda, sem envolvimento pulpar e com grande perda de estrutura, na superfície oclusal do dente 36; lesões cariosas profundas, sem envolvimento pulpar e sem esmalte, nos terços cervicais das faces vestibulares dos dentes 44 e 45.\nCom base na situação apresentada, avalie as afirmações a seguir.\nI. A lesão descrita no dente 35, considerada uma cárie inativa com cavitação, pode ser restaurada com cimento de ionômero de vidro, desde que os contatos oclusais estejam sobre estrutura dental hígida.\nII. As lesões nos dentes 44 e 45 requerem restauração com resina composta pela técnica do sanduíche; para tanto, após condicionamento com ácido fosfórico, deve-se utilizar cimento ionomérico fotopolimerizável.\nIII. A lesão de mancha branca do dente 34 dispensa conduta invasiva com o uso de materiais restauradores, sendo o flúor a melhor opção para o tratamento da lesão.\nIV. Um tratamento conservador do dente 36 consiste na remoção completa da dentina cariada das paredes circundantes da cavidade e, na parede pulpar, remoção com instrumentos manuais apenas da dentina infectada.\nÉ correto apenas o que se afirma em", "alts": ["I e II.", "II e III.", "III e IV.", "I, II e IV.", "I, III e IV."], "gab": "E", "fig": true}, {"ano": 2019, "n": 13, "enun": "Um homem de 65 anos de idade procurou uma clínica odontológica para realização de reabilitação oral. Para planejamento do tratamento, o paciente foi submetido a exames variados e recebeu demonstração do uso de recursos de última geração em reabilitações. Chamaram sua atenção, especialmente, a obtenção de imagens em movimento, que se conectavam diretamente a um computador, e os aparelhos, que ele nunca havia visto antes, que dispensavam o uso de materiais incômodos de moldagem.\nConsiderando a situação apresentada, avalie as asserções a seguir e a relação proposta entre elas.\nI. A evolução tecnológica apresentada ao paciente, com inovações da Odontologia digital, permite transpor barreiras e fronteiras do conhecimento em benefício de um número cada vez maior de profissionais e pacientes, gerando tratamentos previsíveis e precisos.\nPOrQUe\nII. A excelência dos resultados depende do uso de recursos tecnológicos como os relatados pelo paciente, permitindo que a Odontologia utilize tais recursos como um fim em si, compensando deficiências técnicas da Odontologia convencional.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "C", "fig": false}, {"ano": 2019, "n": 14, "enun": "Uma menina de oito anos de idade e com dentição mista foi levada por sua mãe à clínica integrada infantil para avaliação odontológica. Durante a anamnese, a mãe relatou que a filha respirava pela boca. Na avaliação intrabucal, observaram-se a presença de mordida cruzada posterior unilateral esquerda de canino decíduo a primeiro molar permanente, atresia do arco dentário superior, palato profundo e inclinação normal dos dentes posteriores. Todos os dentes estavam hígidos. Por meio de avaliação radiográfica, foi diagnosticada a presença de adenoide hipertrófica.\nCom base no caso apresentado, avalie as afirmações a seguir.\nI. O tratamento integral da paciente depende de uma equipe multidisciplinar composta por cirurgião-dentista, otorrinolaringologista e fonoaudiólogo, para restabelecer o equilíbrio da função do sistema estomatognático.\nII. As características do caso, como o formato do arco dentário superior atrésico, a inclinação normal dos dentes posteriores e o cruzamento de todos os dentes posteriores, definem o diagnóstico para mordida cruzada posterior do tipo dentário.\nIII. A abordagem terapêutica a ser preconizada é a expansão rápida da maxila, com o intuito de aumentar a dimensão transversal do arco dentário superior.\nIV. A mordida cruzada posterior se autocorrige nos estágios do desenvolvimento da oclusão, dispensando tratamento na fase precoce.\nÉ correto apenas o que se afirma em", "alts": ["I e III.", "I e IV.", "II e III.", "I, II e IV.", "II, III e IV."], "gab": "A", "fig": false}, {"ano": 2019, "n": 16, "enun": "A varfarina sódica é indicada na prevenção primária e secundária de tromboembolismo venoso, na prevenção de embolismo sistêmico em pacientes com prótese de válvulas cardíacas ou fibrilação atrial e na prevenção de acidente vascular cerebral.\nA monitorização do paciente é feita pelo RNI (Razão\nNormalizada Internacional), exame usado para determinar a tendência de coagulação do sangue.\nDisponível em: <http://www.anvisa.gov.br/datavisa/fila_bula/ frmVisualizarBula.asp?pNuTransacao=10646172014&pIdAne xo=2331674>. Acesso em: 13 jul. 2019 (adaptado).\nConsiderando as informações apresentadas, avalie as asserções a seguir e a relação proposta entre elas.\nI. Os anti-inflamatórios não esteroidais são contraindicados em cirurgia oral de pequeno porte envolvendo pacientes que fazem uso de varfarina com RNI situado entre 2,0 e 3,5.\nPOrQUe\nII. Os anti-inflamatórios não esteroidais aumentam o valor do RNI e o risco de hemorragia, razão pela qual indica-se suspensão do anticoagulante quatro dias antes do procedimento odontológico.\nA respeito dessas asserções, assinale a opção correta.", "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "C", "fig": false}, {"ano": 2019, "n": 17, "enun": "Um paciente de 13 anos de idade sofreu uma queda de bicicleta que resultou em avulsão do dente 11. O dente foi colocado em um copo com água e, imediatamente, o menino foi conduzido por seus responsáveis à unidade básica de saúde do seu bairro.\nConsiderando o caso apresentado, é correto afirmar que, após o pronto atendimento do paciente, o tratamento para a situação clínica é", "alts": ["uso de coroa dentária para confecção de um mantenedor de espaço, verificação da caderneta de vacinação contra tétano, medicação analgésica e proservação de seis em seis meses até a reparação protética.", "lavagem do dente com soro fisiológico, reimplantação, fixação semirrígida, verificação da caderneta de vacinação contra tétano, medicação antiobiótica, bochecho com gluconato de clorexidina a 0,12% por uma semana, retorno em 15 dias e proservação.", "raspagem da raiz para remoção dos detritos, reimplantação do dente, fixação rígida, medicação antiobiótica, bochecho com gluconato de clorexidina a 0,12% por uma semana e retorno em 30 dias.", "lavagem do dente com gluconato de clorexidina a 0,12%, reimplantação do dente, fixação semirrígida, verificação da caderneta de vacinação contra tétano, medicação anti- inflamatória, bochecho com água oxigenada 10 volumes por três dias e retorno em 15 dias.", "doação do dente avulsionado a um banco de dentes por meio de um termo de consentimento livre e esclarecido, uso de dente de estoque para confeccção de um mantenedor de espaço, medicação analgésica e proservação de seis em seis meses até a recuperação protética."], "gab": "B", "fig": false}, {"ano": 2019, "n": 18, "enun": "Um paciente de 37 anos de idade procurou atendimento odontológico para o dente 15, cuja restauração provisória havia se deslocado cerca de 8 meses antes. No exame clínico, foi observado pouco remanescente dental, com margem subgengival localizada a 1,0 mm da crista óssea, tratamento endodôntico realizado e ausência de lesão óssea periapical. Verificou-se, ainda, que seria necessário o restabelecimento do espaço biológico para melhor tratamento da porção coronária. As figuras 1, 2 e 3 apresentam, respectivamente, as imagens do aspecto clínico, da radiografia periapical e da radiografia interproximal referentes ao dente 15.\nAssinale a opção que apresenta o plano de tratamento na sequência correta de execução para o caso apresentado.", "alts": ["Gengivectomia para remoção do tecido gengival da margem do preparo, retratamento endodôntico, núcleo metálico fundido e coroa total de cerâmica.", "Extrusão cirúrgica, esplintagem semirrígida, cirurgia periodontal, pino de fibra de vidro, núcleo em resina composta e coroa de cerâmica.", "Gengivectomia, retentor intrarradicular de fibra de vidro, núcleo de preenchimento em resina composta, provisório em resina acrílica e coroa total em cerâmica.", "Extrusão ortodôntica ou cirurgia periodontal, núcleo de fibra de vidro, restauração provisória com cimento de ionômero de vidro e coroa metalocerâmica.", "Extrusão ortodôntica ou cirurgia periodontal, retratamento endodôntico, pino de fibra de vidro e coroa total de cerâmica. CASTELO-BAZ et al. Journal of Prosthetic Dentistry. v. 121 n. 4, p. 553-556, 2019 (adaptado)."], "gab": "E", "fig": true}, {"ano": 2019, "n": 23, "enun": "Uma mulher de 30 anos de idade compareceu a uma unidade de saúde em busca de atendimento com cirurgião-dentista, após ter sido fisicamente agredida por seu parceiro. Ao exame clínico, constatou- se que ela apresentava um edema acentuado no terço médio da face do lado direito, que dificultava a abertura do olho, várias escoriações, hematomas e dentes anteriores superiores fraturados. A paciente queixava-se de visão dupla e insensibilidade na pele embaixo do olho direito. Foi realizada radiografia posteroanterior (PA) de seio maxilar, na qual observou-se fratura do arco zigomático e assoalho de órbita direitos.\nCom base no caso apresentado e considerando a legislação brasileira que trata de feminicídio e violência contra a mulher, avalie as afirmações a seguir quanto à(s) conduta(s) a ser(em) adotada(s) pelo cirurgião-dentista.\nI. Solicitar ao gestor da Unidade de Saúde que faça a notificação compulsória do caso, contribuindo com a fidedignidade dos dados publicados nos sistemas de informação e com a implementação de políticas públicas de intervenção e prevenção.\nII. Encaminhar a paciente, após as medidas iniciais na unidade, para atendimento por equipe multiprofissional de nível terciário, que envolva as áreas de bucomaxilofacial, neurologia e ortopedia.\nIII. Realizar tratamento de urgência nos dentes fraturados, recomendar aplicação de gelo na face para reduzir o edema e marcar retorno para acompanhamento e realização dos procedimentos definitivos.\nIV. Realizar a notificação compulsória e encaminhar a paciente para a delegacia da mulher ou órgão de referência, para o apoio psicológico e para o hospital, respeitando a integralidade preconizada pelo SUS e articulando os serviços de saúde e sociais para amparo da vítima.\nEstá correto apenas o que se afirma em", "alts": ["I e II.", "I e III.", "II e IV.", "I, III e IV.", "II, III e IV."], "gab": "C", "fig": false}, {"ano": 2019, "n": 25, "enun": "I. Os pacientes alérgicos a algumas frutas tropicais podem apresentar alergia a produtos cujas matérias-primas contenham látex.\nII. A reação alérgica apresentada é severa, portanto, deve-se proceder à aplicação imediata de adrenalina 1:1 000 por via intramuscular e ao encaminhamento ao serviço médico de urgência.\nIII. O plano de ação para o caso envolve a limpeza dos resíduos de latex por meio da antissepsia das mãos e dos antebraços com água e sabão, seguido de álcool 70%, e uso de luvas de silicone.\nÉ correto o que se afirma em", "alts": ["II, apenas.", "III, apenas.", "I e II, apenas.", "I e III, apenas.", "I, II e III."], "gab": "E", "fig": false}, {"ano": 2019, "n": 3
